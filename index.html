<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物理实验室</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="site.css">
  <style>
    main {
      padding: 36px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .card {
      height: 240px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 60px;
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--soft-line);
    }

    .card-title {
      color: var(--ink);
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
      text-decoration: none;
    }

    a.card-title:hover,
    a.card-title:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .card-count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .card-body {
      padding: 0 22px;
    }

    .homework-link {
      display: grid;
      place-items: center;
      height: 180px;
      color: var(--ink);
      text-decoration: none;
    }

    .homework-mark {
      display: grid;
      place-items: center;
      width: 96px;
      height: 96px;
      border: 2px solid currentColor;
      border-radius: 50%;
      font-size: 28px;
      font-weight: 700;
    }

    .homework-link:hover,
    .homework-link:focus-visible {
      color: #fff;
      background: var(--ink);
      outline: none;
    }

    @media (max-width: 560px) {
      main {
        width: calc(100% - 24px);
        padding: 24px 0;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card-header {
        padding: 12px 18px;
      }

      .card-body {
        padding: 0 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="grid" id="cards"></div>
  </main>

  <script src="site.js"></script>
  <script>
    const { el, countText, sectionUrl, itemRow } = window.Lab;

    function renderCard(section) {
      const card = el("section", "card");
      const header = el("div", "card-header");
      const title = el("a", "card-title", section.title);
      title.href = sectionUrl(section.id);
      header.append(title, el("span", "card-count", countText(section.items.length)));

      const list = el("ul", "item-list");
      section.items.slice(0, 3).forEach((item) => list.append(itemRow(item, section, [])));
      if (section.items.length === 0) {
        list.append(el("li", "empty-note", "暂无内容"));
      }

      const body = el("div", "card-body");
      body.append(list);
      card.append(header, body);
      return card;
    }

    // 单个入口的卡片：作业问答系统、作业答案与详解
    function renderLinkCard(titleText, href, mark) {
      const card = el("section", "card");
      const header = el("div", "card-header");
      header.append(el("span", "card-title", titleText));

      const link = el("a", "homework-link");
      link.href = href;
      link.append(el("span", "homework-mark", mark));

      card.append(header, link);
      return card;
    }

    window.Lab.loadSections().then((sections) => {
      document.querySelector("#cards").replaceChildren(
        ...sections.map(renderCard),
        renderLinkCard("作业问答系统", "tutor/screen.html", "问答"),
        renderLinkCard("作业答案与详解", "tutor/", "解析")
      );
    });
  </script>
</body>
</html>
