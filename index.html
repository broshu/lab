<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:    #1c2b25;
    --green:  #2f5d4f;
    --green-2:#3f7060;
    --accent: #8a9a5b;
    --paper:  #f4f1e8;
    --card:   #faf8f1;
    --line:   #d8d2c0;
    --muted:  #6b7269;
    --shadow: 0 1px 2px rgba(28,43,37,.05), 0 12px 32px -16px rgba(28,43,37,.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px 24px;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 15%, rgba(47,93,79,.05), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(138,154,91,.06), transparent 50%);
    pointer-events: none; z-index: 0;
  }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 880px; }

  .blocks {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }

  .block {
    position: relative;
    display: flex;
    align-items: flex-end;
    min-height: 230px;
    padding: 32px;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    color: var(--ink);
    overflow: hidden;
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s;
  }
  .block:hover {
    transform: translateY(-5px);
    border-color: var(--accent);
    box-shadow: 0 22px 48px -20px rgba(28,43,37,.45);
  }

  .block .no {
    position: absolute; top: 24px; left: 32px;
    font-family: "Cormorant Garamond", serif; font-style: italic;
    font-size: 1.3rem; color: var(--accent);
  }
  .block h2 {
    font-family: "Cormorant Garamond", serif;
    font-size: 2.6rem; font-weight: 600; color: var(--green);
    letter-spacing: .5px; line-height: 1;
  }
  .block .arrow {
    position: absolute; bottom: 32px; right: 32px;
    font-size: 1.4rem; color: var(--accent);
    transition: transform .3s ease;
  }
  .block:hover .arrow { transform: translateX(6px); }

  @media (max-width: 640px) {
    .blocks { grid-template-columns: 1fr; gap: 18px; }
    .block { min-height: 170px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="blocks">
      <a class="block" href="#papers"><span class="no">01</span><h2>Papers</h2><span class="arrow">→</span></a>
      <a class="block" href="#tools"><span class="no">02</span><h2>Tools</h2><span class="arrow">→</span></a>
      <a class="block" href="#about"><span class="no">03</span><h2>About Me</h2><span class="arrow">→</span></a>
      <a class="block" href="#resources"><span class="no">04</span><h2>Resources</h2><span class="arrow">→</span></a>
    </div>
  </main>
</body>
</html>
