<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics Lab</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f7f5;
      --card: #fff;
      --ink: #111;
      --muted: #646464;
      --line: #d9d9d4;
      --soft-line: #ececea;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr));
      gap: 18px;
      align-items: start;
    }

    .card {
      min-height: 280px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--soft-line);
    }

    .card-title {
      color: var(--ink);
      font-size: 19px;
      line-height: 1.2;
      font-weight: 650;
      letter-spacing: 0;
      text-decoration: none;
    }

    .card-title:hover,
    .card-title:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .card-count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .card-body {
      padding: 8px 22px 18px;
    }

    .item-list {
      display: grid;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .item-row {
      min-height: 54px;
      padding: 12px 0;
      border-top: 1px solid var(--soft-line);
    }

    .item-row:first-child {
      border-top: 0;
    }

    .item-link {
      display: block;
      width: 100%;
      overflow: hidden;
      padding: 9px 0;
      border: 0;
      color: var(--ink);
      background: transparent;
      font-size: 15px;
      font-family: inherit;
      font-weight: 600;
      line-height: 1.35;
      text-align: left;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .item-link:hover,
    .item-link:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .item-note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .folder-icon {
      display: inline-block;
      width: 15px;
      height: 11px;
      margin-right: 8px;
      border: 1px solid currentColor;
      border-radius: 2px;
      border-top-left-radius: 1px;
      box-shadow: 4px -4px 0 -1px #fff, 4px -4px 0 0 currentColor;
      flex: 0 0 auto;
    }

    .question-card {
      min-height: 260px;
    }

    .ask-link {
      display: grid;
      place-items: center;
      min-height: 178px;
      color: var(--ink);
      text-decoration: none;
    }

    .ask-mark {
      display: grid;
      place-items: center;
      width: 96px;
      height: 96px;
      border: 2px solid currentColor;
      border-radius: 50%;
      font-size: 28px;
      font-weight: 700;
    }

    .ask-link:hover,
    .ask-link:focus-visible {
      color: #fff;
      background: var(--ink);
      outline: none;
    }

    @media (max-width: 560px) {
      main {
        width: min(100% - 24px, 1120px);
        padding: 24px 0;
      }

      .card {
        min-height: 240px;
      }

      .card-header {
        padding: 18px 18px 14px;
      }

      .card-body {
        padding: 8px 18px 16px;
      }

      .item-link {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="grid" id="cards"></div>
  </main>

  <script src="library-data.js"></script>
  <script>
    const questionCard = {
      title: "Question",
      href: "https://forms.cloud.microsoft/r/Lg4N3RAWZR"
    };

    const cardsRoot = document.querySelector("#cards");

    function createElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) {
        element.className = className;
      }
      if (text) {
        element.textContent = text;
      }
      return element;
    }

    function itemCount(card) {
      return card.items.length;
    }

    function makeFileLink(item, shouldDownload) {
      const action = createElement("a", "item-link", item.name);
      action.href = item.href;
      action.title = item.name;
      if (shouldDownload) {
        action.download = "";
      } else {
        action.target = "_blank";
        action.rel = "noopener";
      }
      return action;
    }

    function makeFolderPreview(folder) {
      const link = createElement("a", "item-link");
      const icon = createElement("span", "folder-icon");
      const name = document.createTextNode(folder.name);
      const note = createElement("span", "item-note", `${folder.children.length} items`);
      link.href = `library.html?section=resources&path=${encodeURIComponent(folder.name)}`;
      link.title = folder.name;
      link.append(icon, name, note);
      return link;
    }

    function renderCard(card) {
      const section = createElement("section", "card");
      const header = createElement("div", "card-header");
      const title = createElement("a", "card-title", card.title);
      title.href = `library.html?section=${encodeURIComponent(card.id)}`;
      header.append(title, createElement("span", "card-count", `${itemCount(card)} items`));

      const body = createElement("div", "card-body");
      const list = createElement("ul", "item-list");
      const shouldDownload = card.type === "download";
      card.items.forEach((item) => {
        const row = createElement("li", "item-row");
        if (item.type === "folder") {
          row.append(makeFolderPreview(item));
        } else {
          row.append(makeFileLink(item, shouldDownload));
        }
        list.append(row);
      });
      body.append(list);
      section.append(header, body);
      return section;
    }

    function renderQuestionCard() {
      const section = createElement("section", "card question-card");
      const header = createElement("div", "card-header");
      header.append(createElement("span", "card-title", questionCard.title));

      const link = createElement("a", "ask-link");
      link.href = questionCard.href;
      link.target = "_blank";
      link.rel = "noopener";
      link.append(createElement("span", "ask-mark", "Ask"));

      section.append(header, link);
      return section;
    }

    cardsRoot.replaceChildren(...window.LAB_DATA.map(renderCard), renderQuestionCard());
  </script>
</body>
</html>
