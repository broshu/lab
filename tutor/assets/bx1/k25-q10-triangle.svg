<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">第10题 动态矢量三角形</title><desc id="desc">重力 mg 大小方向不变，OM 拉力方向不变，ON 拉力从水平转到竖直：F_OM 一直减小，F_ON 先减小后增大，与 OM 垂直时最小。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#304458}</style><rect width="600" height="440" fill="white"/><path d="M200.0 60.0 L427.3 384.6" fill="none" stroke="#8a99a8" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M200.0 60.0 L200.0 360.0" fill="none" stroke="#b25132" stroke-width="3" stroke-linecap="round"/><polygon points="200.0,360.0 206.0,347.0 194.0,347.0" fill="#b25132"/><text x="170.0" y="210.0" text-anchor="middle" style="font-size:21px;fill:#b25132;font-weight:400"><tspan style="font-style:italic">mg</tspan></text><path d="M200.0 360.0 L410.1 360.0" fill="none" stroke="#9fb3c4" stroke-width="1.8" stroke-linecap="round"/><polygon points="410.1,360.0 397.1,354.0 397.1,366.0" fill="#9fb3c4"/><path d="M200.0 360.0 L351.2 276.0" fill="none" stroke="#9fb3c4" stroke-width="1.8" stroke-linecap="round"/><polygon points="351.2,276.0 337.0,277.1 342.8,287.6" fill="#9fb3c4"/><path d="M200.0 360.0 L341.0 261.3" fill="none" stroke="#147d92" stroke-width="2.6" stroke-linecap="round"/><polygon points="341.0,261.3 326.9,263.8 333.7,273.7" fill="#147d92"/><path d="M200.0 360.0 L273.5 165.0" fill="none" stroke="#9fb3c4" stroke-width="1.8" stroke-linecap="round"/><polygon points="273.5,165.0 263.3,175.0 274.5,179.3" fill="#9fb3c4"/><path d="M341.0 261.3 L200.0 60.0" fill="none" stroke="#6b4fa0" stroke-width="2.6" stroke-linecap="round"/><polygon points="200.0,60.0 202.5,74.1 212.4,67.2" fill="#6b4fa0"/><text x="365.0" y="231.3" text-anchor="middle" style="font-size:19px;fill:#6b4fa0;font-weight:400"><tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">OM</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan></text><text x="310.5" y="326.7" text-anchor="start" style="font-size:18px;fill:#147d92;font-weight:400"><tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">ON</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan> 最小</text><path d="M332.9 249.8 L321.5 257.9 L329.5 269.3" fill="none" stroke="#147d92" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="422.1" y="366.0" text-anchor="start" style="font-size:15px;fill:#304458;font-weight:400">起点：ON 水平</text><text x="216.0" y="54.0" text-anchor="start" style="font-size:15px;fill:#304458;font-weight:400">终点：ON 竖直，<tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">ON</tspan><tspan dy="-5" style="font-style:italic">=mg</tspan></text><text x="300.0" y="415.0" text-anchor="middle" style="font-size:16px;fill:#304458;font-weight:400"><tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">OM</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan> 的起点沿虚线一路上移 → <tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">OM</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan> 一直减小</text></svg>