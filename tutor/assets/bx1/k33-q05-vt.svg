<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc"><title id="title">第5题 小炭块与传送带的 v-t 图像</title><desc id="desc">炭块 0.2 s 内从 4 m/s 减到 2 m/s（比传送带快，相对前移 0.2 m），再 1 s 内减到 0（比传送带慢，相对后移 1 m）；痕迹长 1 m。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#304458}</style><rect width="600" height="400" fill="white"/><path d="M80.0 320.0 L540.0 320.0" fill="none" stroke="#304458" stroke-width="1.6" stroke-linecap="round"/><polygon points="540.0,320.0 527.0,314.0 527.0,326.0" fill="#304458"/><text x="554.0" y="326.0" text-anchor="middle" style="font-size:18px;fill:#304458;font-weight:400"><tspan style="font-style:italic">t</tspan>/s</text><path d="M80.0 320.0 L80.0 40.0" fill="none" stroke="#304458" stroke-width="1.6" stroke-linecap="round"/><polygon points="80.0,40.0 74.0,53.0 86.0,53.0" fill="#304458"/><text x="88.0" y="32.0" text-anchor="start" style="font-size:18px;fill:#304458;font-weight:400"><tspan style="font-style:italic">v</tspan>/(m·s⁻¹)</text><text x="68.0" y="340.0" text-anchor="middle" style="font-size:16px;fill:#304458;font-weight:400"><tspan style="font-style:italic">O</tspan></text><path d="M135.0 320.0 L135.0 325.0" fill="none" stroke="#304458" stroke-width="1.2" stroke-linecap="round"/><text x="135.0" y="342.0" text-anchor="middle" style="font-size:15px;fill:#304458;font-weight:400">0.2</text><path d="M410.0 320.0 L410.0 325.0" fill="none" stroke="#304458" stroke-width="1.2" stroke-linecap="round"/><text x="410.0" y="342.0" text-anchor="middle" style="font-size:15px;fill:#304458;font-weight:400">1.2</text><path d="M75.0 200.0 L80.0 200.0" fill="none" stroke="#304458" stroke-width="1.2" stroke-linecap="round"/><text x="70.0" y="205.0" text-anchor="end" style="font-size:15px;fill:#304458;font-weight:400">2</text><path d="M75.0 80.0 L80.0 80.0" fill="none" stroke="#304458" stroke-width="1.2" stroke-linecap="round"/><text x="70.0" y="85.0" text-anchor="end" style="font-size:15px;fill:#304458;font-weight:400">4</text><polygon points="80.0,80 135.0,200 80.0,200" fill="#b25132" fill-opacity="0.18"/><polygon points="135.0,200 410.0,200 410.0,320" fill="#147d92" fill-opacity="0.18"/><path d="M80.0 200.0 L478.8 200.0" fill="none" stroke="#8a99a8" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5"/><text x="484.8" y="205.0" text-anchor="start" style="font-size:15px;fill:#8a99a8;font-weight:400">传送带</text><path d="M80.0 80 L135.0 200 L410.0 320" fill="none" stroke="#b25132" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M135.0 200.0 L135.0 320.0" fill="none" stroke="#8a99a8" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="129.2" y="134.0" text-anchor="start" style="font-size:15px;fill:#b25132;font-weight:400">炭块比带快：前移 0.2 m</text><text x="286.2" y="245.0" text-anchor="start" style="font-size:15px;fill:#147d92;font-weight:400">带比炭块快：</text><text x="286.2" y="265.0" text-anchor="start" style="font-size:15px;fill:#147d92;font-weight:400">后移 1 m</text><text x="300.0" y="385.0" text-anchor="middle" style="font-size:16px;fill:#304458;font-weight:400">后移的 1 m 覆盖了前移的 0.2 m → 痕迹长 1 m</text></svg>