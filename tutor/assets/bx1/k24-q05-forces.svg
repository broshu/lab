<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="title desc"><title id="title">第5题 头部受力的正交分解</title><desc id="desc">头受重力 G、颈椎支持力 F1（与竖直成 37°，斜向左上）、肌肉拉力 F2（与水平成 45°，斜向右下），三力平衡。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#304458}</style><rect width="560" height="400" fill="white"/><path d="M50.0 170.0 L510.0 170.0" fill="none" stroke="#c5ced6" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M250.0 30.0 L250.0 380.0" fill="none" stroke="#c5ced6" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M250.0 170.0 L171.8 66.2" fill="none" stroke="#147d92" stroke-width="2.8" stroke-linecap="round"/><polygon points="171.8,66.2 174.8,80.2 184.4,72.9" fill="#147d92"/><text x="161.8" y="54.2" text-anchor="middle" style="font-size:21px;fill:#147d92;font-weight:400"><tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">1</tspan><tspan dy="-5" style="font-style:italic">=5G</tspan></text><path d="M250.0 170.0 L328.0 248.0" fill="none" stroke="#6b4fa0" stroke-width="2.8" stroke-linecap="round"/><polygon points="328.0,248.0 323.1,234.6 314.6,243.1" fill="#6b4fa0"/><text x="350.0" y="254.0" text-anchor="middle" style="font-size:21px;fill:#6b4fa0;font-weight:400"><tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">2</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan></text><path d="M250.0 170.0 L250.0 196.0" fill="none" stroke="#b25132" stroke-width="2.8" stroke-linecap="round"/><polygon points="250.0,196.0 256.0,183.0 244.0,183.0" fill="#b25132"/><text x="266.0" y="212.0" text-anchor="middle" style="font-size:21px;fill:#b25132;font-weight:400"><tspan style="font-style:italic">G</tspan></text><circle cx="250.0" cy="170.0" r="4.5" fill="#304458"/><path d="M250.0 130.0 A40 40 0 0 0 225.9 138.1" fill="none" stroke="#304458" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="231.6" y="121.0" text-anchor="middle" style="font-size:16px;fill:#304458;font-weight:400">37°</text><path d="M282.5 202.5 A46 46 0 0 0 296.0 170.0" fill="none" stroke="#304458" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="311.0" y="201.3" text-anchor="middle" style="font-size:16px;fill:#304458;font-weight:400">45°</text><text x="400.0" y="300.0" text-anchor="middle" style="font-size:16px;fill:#304458;font-weight:400">竖直：<tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">1</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan>cos37° = <tspan style="font-style:italic">G</tspan> + <tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">2</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan>sin45°</text><text x="400.0" y="326.0" text-anchor="middle" style="font-size:16px;fill:#304458;font-weight:400">水平：<tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">1</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan>sin37° = <tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">2</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan>cos45°</text><text x="400.0" y="358.0" text-anchor="middle" style="font-size:16px;fill:#304458;font-weight:400">⇒ 0.8<tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">1</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan> = <tspan style="font-style:italic">G</tspan> + 0.6<tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">1</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan>，<tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">1</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan> = 5<tspan style="font-style:italic">G</tspan></text></svg>