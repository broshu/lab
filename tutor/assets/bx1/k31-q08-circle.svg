<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" role="img" aria-labelledby="title desc"><title id="title">第8题 等时圆</title><desc id="desc">Q、N 是竖直直径的两端，P 在圆上，QP 与竖直方向夹角为 α，QP = QN·cosα，a = g·cosα，所以滑行时间与 α 无关。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#304458}</style><rect width="520" height="470" fill="white"/><circle cx="240.0" cy="235.0" r="170" fill="none" stroke="#8a99a8" stroke-width="1.4"/><path d="M410 235 A170 170 0 0 1 240 405" fill="none" stroke="#304458" stroke-width="3"/><path d="M240.0 65.0 L240.0 405.0" fill="none" stroke="#304458" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M240.0 65.0 L309.1 390.3" fill="none" stroke="#9fb3c4" stroke-width="2" stroke-linecap="round"/><path d="M240.0 65.0 L387.2 320.0" fill="none" stroke="#147d92" stroke-width="3" stroke-linecap="round"/><path d="M387.2 320.0 L240.0 405.0" fill="none" stroke="#8a99a8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="387.2" cy="320.0" r="4" fill="#147d92"/><text x="403.2" y="324.0" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400"><tspan style="font-style:italic">P</tspan></text><path d="M380.2 307.9 L368.1 314.9 L375.1 327.0" fill="none" stroke="#304458" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M240.0 105.0 A40 40 0 0 0 260.0 99.6" fill="none" stroke="#304458" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="254.5" y="125.1" text-anchor="middle" style="font-size:18px;fill:#304458;font-weight:400"><tspan style="font-style:italic">α</tspan></text><path d="M240.0 65.0 L409.1 252.8" fill="none" stroke="#9fb3c4" stroke-width="2" stroke-linecap="round"/><circle cx="240.0" cy="65.0" r="4.5" fill="#304458"/><circle cx="240.0" cy="405.0" r="4.5" fill="#304458"/><circle cx="240.0" cy="235.0" r="3" fill="#304458"/><text x="220.0" y="59.0" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400"><tspan style="font-style:italic">Q</tspan></text><text x="220.0" y="413.0" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400"><tspan style="font-style:italic">N</tspan></text><text x="220.0" y="241.0" text-anchor="middle" style="font-size:18px;fill:#304458;font-weight:400"><tspan style="font-style:italic">O</tspan></text><text x="260.0" y="450.0" text-anchor="middle" style="font-size:16px;fill:#304458;font-weight:400">∠QPN = 90° → QP = QN·cos α；a = g cos α → t 相同</text></svg>