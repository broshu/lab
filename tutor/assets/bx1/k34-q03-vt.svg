<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc"><title id="title">第3题 煤块与长木板的 v-t 图像</title><desc id="desc">煤块从 0 以 2 m/s² 加速，木板从 3 m/s 以 1 m/s² 加速，3 s 时共速 6 m/s；两线所夹面积为相对位移 4.5 m。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#304458}</style><rect width="600" height="400" fill="white"/><path d="M80.0 330.0 L540.0 330.0" fill="none" stroke="#304458" stroke-width="1.6" stroke-linecap="round"/><polygon points="540.0,330.0 527.0,324.0 527.0,336.0" fill="#304458"/><text x="554.0" y="336.0" text-anchor="middle" style="font-size:18px;fill:#304458;font-weight:400"><tspan style="font-style:italic">t</tspan>/s</text><path d="M80.0 330.0 L80.0 30.0" fill="none" stroke="#304458" stroke-width="1.6" stroke-linecap="round"/><polygon points="80.0,30.0 74.0,43.0 86.0,43.0" fill="#304458"/><text x="88.0" y="22.0" text-anchor="start" style="font-size:18px;fill:#304458;font-weight:400"><tspan style="font-style:italic">v</tspan>/(m·s⁻¹)</text><text x="68.0" y="350.0" text-anchor="middle" style="font-size:16px;fill:#304458;font-weight:400"><tspan style="font-style:italic">O</tspan></text><path d="M365.0 330.0 L365.0 335.0" fill="none" stroke="#304458" stroke-width="1.2" stroke-linecap="round"/><text x="365.0" y="352.0" text-anchor="middle" style="font-size:15px;fill:#304458;font-weight:400">3</text><path d="M460.0 330.0 L460.0 335.0" fill="none" stroke="#304458" stroke-width="1.2" stroke-linecap="round"/><text x="460.0" y="352.0" text-anchor="middle" style="font-size:15px;fill:#304458;font-weight:400">4</text><path d="M75.0 210.0 L80.0 210.0" fill="none" stroke="#304458" stroke-width="1.2" stroke-linecap="round"/><text x="70.0" y="215.0" text-anchor="end" style="font-size:15px;fill:#304458;font-weight:400">3</text><path d="M75.0 90.0 L80.0 90.0" fill="none" stroke="#304458" stroke-width="1.2" stroke-linecap="round"/><text x="70.0" y="95.0" text-anchor="end" style="font-size:15px;fill:#304458;font-weight:400">6</text><polygon points="80,330 80,210 365,90" fill="#147d92" fill-opacity="0.16"/><path d="M80.0 210.0 L365.0 90.0" fill="none" stroke="#304458" stroke-width="3" stroke-linecap="round"/><path d="M80.0 330.0 L365.0 90.0" fill="none" stroke="#b25132" stroke-width="3" stroke-linecap="round"/><path d="M365.0 90.0 L498.0 24.7" fill="none" stroke="#6b4fa0" stroke-width="3" stroke-linecap="round"/><path d="M365.0 90.0 L365.0 330.0" fill="none" stroke="#8a99a8" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M80.0 90.0 L365.0 90.0" fill="none" stroke="#8a99a8" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="118.0" y="140.0" text-anchor="start" style="font-size:15px;fill:#304458;font-weight:400">木板 <tspan style="font-style:italic">a</tspan><tspan dy="5" style="font-size:0.72em">2</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan> = 1 m/s²</text><text x="260.5" y="242.0" text-anchor="start" style="font-size:15px;fill:#b25132;font-weight:400">煤块 <tspan style="font-style:italic">a</tspan><tspan dy="5" style="font-size:0.72em">1</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan> = 2 m/s²</text><text x="379.2" y="118.0" text-anchor="start" style="font-size:15px;fill:#6b4fa0;font-weight:400">共速后一起</text><text x="379.2" y="138.0" text-anchor="start" style="font-size:15px;fill:#6b4fa0;font-weight:400"><tspan style="font-style:italic">a</tspan><tspan dy="5" style="font-size:0.72em">3</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan> = 7/6 m/s²</text><text x="151.2" y="226.0" text-anchor="middle" style="font-size:17px;fill:#147d92;font-weight:400">4.5 m</text><text x="300.0" y="388.0" text-anchor="middle" style="font-size:15px;fill:#304458;font-weight:400">阴影面积 = ½ × 3 × 3 = 4.5 m（煤块相对木板向左滑的距离）</text></svg>