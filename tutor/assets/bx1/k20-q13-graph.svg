<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc"><title id="title">第13题 摩擦力随时间变化</title><desc id="desc">先滑动摩擦力随 t 线性增大并超过 G，物体减速到静止后突变为静摩擦力，等于 G。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#304458}</style><rect width="600" height="380" fill="white"/><path d="M70.0 320.0 L570.0 320.0" fill="none" stroke="#304458" stroke-width="1.8" stroke-linecap="round"/><polygon points="570.0,320.0 557.0,314.0 557.0,326.0" fill="#304458"/><text x="580.0" y="326.0" text-anchor="middle" style="font-size:21px;fill:#304458;font-weight:400"><tspan style="font-style:italic">t</tspan></text><path d="M70.0 320.0 L70.0 40.0" fill="none" stroke="#304458" stroke-width="1.8" stroke-linecap="round"/><polygon points="70.0,40.0 64.0,53.0 76.0,53.0" fill="#304458"/><text x="46.0" y="52.0" text-anchor="middle" style="font-size:21px;fill:#304458;font-weight:400"><tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">f</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan></text><text x="58.0" y="342.0" text-anchor="middle" style="font-size:18px;fill:#304458;font-weight:400"><tspan style="font-style:italic">O</tspan></text><path d="M70.0 170.0 L560.0 170.0" fill="none" stroke="#8a99a8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><text x="54.0" y="176.0" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400"><tspan style="font-style:italic">G</tspan></text><path d="M70.0 320.0 L360.0 91.1" fill="none" stroke="#b25132" stroke-width="3" stroke-linecap="round"/><path d="M360.0 91.1 L360.0 170.0" fill="none" stroke="#b25132" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M360.0 170.0 L550.0 170.0" fill="none" stroke="#147d92" stroke-width="3" stroke-linecap="round"/><path d="M260.0 170.0 L260.0 320.0" fill="none" stroke="#8a99a8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M360.0 91.1 L360.0 320.0" fill="none" stroke="#8a99a8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/><text x="260.0" y="344.0" text-anchor="middle" style="font-size:17px;fill:#304458;font-weight:400"><tspan style="font-style:italic">t</tspan><tspan dy="5" style="font-size:0.72em">1</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan></text><text x="360.0" y="344.0" text-anchor="middle" style="font-size:17px;fill:#304458;font-weight:400"><tspan style="font-style:italic">t</tspan><tspan dy="5" style="font-size:0.72em">2</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan></text><text x="150.0" y="280.0" text-anchor="start" style="font-size:17px;fill:#b25132;font-weight:400">下滑：<tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">f</tspan><tspan dy="-5" style="font-style:italic">=μkt</tspan></text><text x="170.0" y="120.0" text-anchor="start" style="font-size:16px;fill:#b25132;font-weight:400"><tspan style="font-style:italic">t</tspan><tspan dy="5" style="font-size:0.72em">1</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan> 后 <tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">f</tspan><tspan dy="-5" style="font-style:italic">&gt;G</tspan>，减速</text><text x="410.0" y="156.0" text-anchor="middle" style="font-size:17px;fill:#147d92;font-weight:400">静止：<tspan style="font-style:italic">F</tspan><tspan dy="5" style="font-size:0.72em">f</tspan><tspan dy="-5" style="font-style:italic">=G</tspan></text><text x="310.0" y="370.0" text-anchor="middle" style="font-size:16px;fill:#304458;font-weight:400"><tspan style="font-style:italic">t</tspan><tspan dy="5" style="font-size:0.72em">2</tspan><tspan dy="-5" style="font-style:italic">&#8203;</tspan> 时刻速度减为零，滑动摩擦力突变为静摩擦力</text></svg>