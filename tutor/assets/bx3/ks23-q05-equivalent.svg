<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" role="img" aria-labelledby="title desc"><title id="title">保留电容支路的稳态辅助电路</title><desc id="desc">R1 和 R3 构成主回路，C 与 R2 串联后跨接 R1。稳态 R2 无电流无电压降，电容器左极板负右极板正。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 1 L7 4 L0 7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:20px;fill:#304458}.wire{fill:none;stroke:#304458;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="560" height="490" fill="white"/><text x="280" y="30" text-anchor="middle" style="font-size:21px;fill:#304458;font-weight:600">稳态：R₂ 中无电流，也无电压降</text><path d="M85 335 L85 295" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M85 205 L85 224" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M85 276 L85 295" fill="none" stroke="#304458" stroke-width="2.4"/><rect x="75" y="224" width="20" height="52" fill="white" stroke="#304458" stroke-width="2.4"/><text x="105" y="256" text-anchor="start" style="font-size:20px;fill:#304458;font-weight:400">R₃</text><path d="M85 205 L85 100 L235 100" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M235 100 L254 100" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M306 100 L325 100" fill="none" stroke="#304458" stroke-width="2.4"/><rect x="254" y="90" width="52" height="20" fill="white" stroke="#304458" stroke-width="2.4"/><text x="280" y="77" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">R₁ = r</text><path d="M325 100 L480 100 L480 335 L320 335" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M240 335 L271 335" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M289 335 L320 335" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M271 323 L271 347" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M289 313 L289 357" fill="none" stroke="#304458" stroke-width="2.4"/><text x="280" y="381" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">E, r</text><path d="M240 335 L85 335" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M150 100 L150 205 L225 205" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M225 205 L253 205" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M267 205 L295 205" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M253 183 L253 227" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M267 183 L267 227" fill="none" stroke="#147d92" stroke-width="2.4"/><text x="260" y="171" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400">C</text><path d="M295 205 L335 205" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M335 205 L354 205" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M406 205 L425 205" fill="none" stroke="#147d92" stroke-width="2.4"/><rect x="354" y="195" width="52" height="20" fill="white" stroke="#147d92" stroke-width="2.4"/><text x="380" y="182" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400">R₂</text><path d="M425 205 L480 205" fill="none" stroke="#147d92" stroke-width="2.4"/><circle cx="150" cy="100" r="4" fill="#304458"/><circle cx="480" cy="100" r="4" fill="#304458"/><text x="222" y="246" text-anchor="middle" style="font-size:24px;fill:#147d92;font-weight:400">−</text><text x="300" y="246" text-anchor="middle" style="font-size:24px;fill:#b25132;font-weight:400">+</text><text x="345" y="280" text-anchor="middle" style="font-size:21px;fill:#147d92;font-weight:400">I₂ = 0，U<tspan baseline-shift="sub" font-size="70%">R₂</tspan> = 0</text><path d="M430 67 L350 67" fill="none" stroke="#304458" stroke-width="2.4" marker-end="url(#arr)"/><text x="460" y="74" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">I</text><text x="280" y="412" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400">C 的右极板与 R₁ 的右端等势</text><text x="280" y="464" text-anchor="middle" style="font-size:21px;fill:#147d92;font-weight:400">所以 U<tspan baseline-shift="sub" font-size="70%">C</tspan> = U<tspan baseline-shift="sub" font-size="70%">R₁</tspan> = IR₁</text></svg>