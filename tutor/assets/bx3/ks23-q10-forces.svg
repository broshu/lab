<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title desc"><title id="title">带负电小球的受力与轨迹</title><desc id="desc">A板正B板负，电场向下。负电小球的电场力向上，重力向下，合力和加速度向上；轨迹由B板左端向A板右端弯曲。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 1 L7 4 L0 7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:20px;fill:#304458}.wire{fill:none;stroke:#304458;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="560" height="440" fill="white"/><text x="280" y="30" text-anchor="middle" style="font-size:21px;fill:#304458;font-weight:600">负电小球：电场力向上，重力向下</text><path d="M75 85 L465 85" fill="none" stroke="#b25132" stroke-width="2.4"/><text x="54" y="92" text-anchor="middle" style="font-size:22px;fill:#b25132;font-weight:400">A</text><text x="280" y="70" text-anchor="middle" style="font-size:20px;fill:#b25132;font-weight:400">+  +  +  +  +  +  +</text><path d="M75 285 L465 285" fill="none" stroke="#147d92" stroke-width="2.4"/><text x="54" y="292" text-anchor="middle" style="font-size:22px;fill:#147d92;font-weight:400">B</text><text x="280" y="314" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400">−  −  −  −  −  −  −</text><path d="M85 275 Q275 275 465 85" fill="none" stroke="#147d92" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="260" cy="232" r="4" fill="#147d92"/><path d="M260 231 L260 139" fill="none" stroke="#b25132" stroke-width="2.4" marker-end="url(#arr)"/><text x="238" y="160" text-anchor="end" style="font-size:18px;fill:#b25132;font-weight:400">F电 = |q|U<tspan baseline-shift="sub" font-size="70%">AB</tspan>/d</text><path d="M260 232 L260 273" fill="none" stroke="#304458" stroke-width="2.4" marker-end="url(#arr)"/><text x="286" y="268" text-anchor="start" style="font-size:18px;fill:#304458;font-weight:400">mg</text><path d="M360 138 L360 205" fill="none" stroke="#147d92" stroke-width="2.4" marker-end="url(#arr)"/><text x="390" y="176" text-anchor="middle" style="font-size:18px;fill:#147d92;font-weight:400">电场</text><path d="M85 275 L148 275" fill="none" stroke="#304458" stroke-width="2.4" marker-end="url(#arr)"/><text x="135" y="257" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">v₀</text><path d="M506 92 L506 278" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M497 85 L515 85" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M497 285 L515 285" fill="none" stroke="#304458" stroke-width="2.4"/><text x="527" y="195" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">d</text><text x="280" y="354" text-anchor="middle" style="font-size:21px;fill:#147d92;font-weight:400">a 向上：|q|U<tspan baseline-shift="sub" font-size="70%">AB</tspan>/d − mg = ma</text><text x="280" y="422" text-anchor="middle" style="font-size:17px;fill:#304458;font-weight:400">轨迹与受力示意，未按实际比例绘制</text></svg>