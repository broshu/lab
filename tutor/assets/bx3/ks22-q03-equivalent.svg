<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 545" role="img" aria-labelledby="title desc"><title id="title">固定电阻并入电源的等效电路</title><desc id="desc">原电路中 r、R1、R2 串联。把 R1 与原电源作为一个等效电源，电动势仍为 E，等效内阻为 r 加 R1，负载仅为 R2。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 1 L7 4 L0 7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:20px;fill:#304458}.wire{fill:none;stroke:#304458;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="560" height="545" fill="white"/><text x="280" y="30" text-anchor="middle" style="font-size:21px;fill:#304458;font-weight:600">原电路：外电阻为 R₁ + R₂</text><path d="M60 192 L60 90 L140 90" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M140 90 L159 90" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M211 90 L230 90" fill="none" stroke="#304458" stroke-width="2.4"/><rect x="159" y="80" width="52" height="20" fill="white" stroke="#304458" stroke-width="2.4"/><text x="185" y="67" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">R₁</text><path d="M230 90 L345 90" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M345 90 L364 90" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M416 90 L435 90" fill="none" stroke="#147d92" stroke-width="2.4"/><rect x="364" y="80" width="52" height="20" fill="white" stroke="#147d92" stroke-width="2.4"/><text x="390" y="67" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400">R₂</text><path d="M435 90 L500 90 L500 192 L325 192" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M235 192 L254 192" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M306 192 L325 192" fill="none" stroke="#304458" stroke-width="2.4"/><rect x="254" y="182" width="52" height="20" fill="white" stroke="#304458" stroke-width="2.4"/><text x="280" y="169" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">r</text><path d="M235 192 L200 192" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M120 192 L151 192" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M169 192 L200 192" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M151 170 L151 214" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M169 180 L169 204" fill="none" stroke="#304458" stroke-width="2.4"/><text x="160" y="238" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">E</text><text x="137" y="165" text-anchor="middle" style="font-size:18px;fill:#b25132;font-weight:400">+</text><path d="M120 192 L60 192" fill="none" stroke="#304458" stroke-width="2.4"/><text x="280" y="305" text-anchor="middle" style="font-size:21px;fill:#304458;font-weight:600">求 R₂ 的功率：把 R₁ 并入电源</text><path d="M60 467 L60 365 L140 365" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M140 365 L159 365" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M211 365 L230 365" fill="none" stroke="#304458" stroke-width="2.4"/><rect x="159" y="355" width="52" height="20" fill="white" stroke="#304458" stroke-width="2.4"/><text x="185" y="342" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">r + R₁</text><path d="M230 365 L345 365" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M345 365 L364 365" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M416 365 L435 365" fill="none" stroke="#147d92" stroke-width="2.4"/><rect x="364" y="355" width="52" height="20" fill="white" stroke="#147d92" stroke-width="2.4"/><text x="390" y="342" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400">R₂</text><path d="M435 365 L500 365 L500 467 L325 467" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M325 467 L270 467" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M190 467 L221 467" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M239 4