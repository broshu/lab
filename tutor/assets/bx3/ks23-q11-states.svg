ill="white" stroke="#304458" stroke-width="2.4"/><text x="170" y="617" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">M</text><path d="M192 610 L270 610 L270 525" fill="none" stroke="#304458" stroke-width="2.4"/><circle cx="270" cy="525" r="4" fill="#304458"/><text x="140" y="655" text-anchor="middle" style="font-size:18px;fill:#147d92;font-weight:400">I<tspan baseline-shift="sub" font-size="70%">M</tspan> = 0.4 A</text><text x="170" y="458" text-anchor="middle" style="font-size:19px;fill:#304458;font-weight:400">I₁ = 0.6 A</text><text x="390" y="458" text-anchor="middle" style="font-size:19px;fill:#304458;font-weight:400">I = 1.0 A</text><text x="280" y="777" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400">U<tspan baseline-shift="sub" font-size="70%">M</tspan> = U<tspan baseline-shift="sub" font-size="70%">R₁</tspan> = 3.0 V，U<tspan baseline-shift="sub" font-size="70%">C</tspan> = U<tspan baseline-shift="sub" font-size="70%">R₂</tspan> = 4.0 V</text><text x="280" y="830" text-anchor="middle" style="font-size:18px;fill:#304458;font-weight:400">理想电压表略去；它与 C 均跨接在 R₂ 两端</text></svg>