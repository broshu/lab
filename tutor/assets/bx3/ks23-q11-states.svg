<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 845" role="img" aria-labelledby="title desc"><title id="title">电动机接通前后的等效电路</title><desc id="desc">S1始终闭合。S2断开时R1R2串联，C和V跨R2；S2闭合时电动机与R1并联，再与R2及电源内阻串联。C支路稳态无电流。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 1 L7 4 L0 7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:20px;fill:#304458}.wire{fill:none;stroke:#304458;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="560" height="845" fill="white"/><text x="280" y="30" text-anchor="middle" style="font-size:21px;fill:#304458;font-weight:600">S₁ 闭合、S₂ 断开：只剩串联回路</text><path d="M60 280 L60 135 L125 135" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M125 135 L144 135" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M196 135 L215 135" fill="none" stroke="#304458" stroke-width="2.4"/><rect x="144" y="125" width="52" height="20" fill="white" stroke="#304458" stroke-width="2.4"/><text x="170" y="112" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">R₁ = 5 Ω</text><path d="M215 135 L345 135" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M345 135 L364 135" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M416 135 L435 135" fill="none" stroke="#304458" stroke-width="2.4"/><rect x="364" y="125" width="52" height="20" fill="white" stroke="#304458" stroke-width="2.4"/><text x="390" y="112" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">R₂ = 4 Ω</text><path d="M435 135 L500 135 L500 280 L280 280" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M200 280 L231 280" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M249 280 L280 280" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M231 258 L231 302" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M249 