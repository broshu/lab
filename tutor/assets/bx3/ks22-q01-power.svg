<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title desc"><title id="title">电源与电动机的功率分配</title><desc id="desc">电源总功率 EI 分成内阻热功率 I²r 和电动机输入功率 UI；UI 再分成线圈热功率 I²R 与机械功率。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 1 L7 4 L0 7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:20px;fill:#304458}.wire{fill:none;stroke:#304458;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="560" height="440" fill="white"/><text x="280" y="32" text-anchor="middle" style="font-size:21px;fill:#304458;font-weight:600">先区分电源内阻 r 与电动机线圈电阻 R</text><rect x="145" y="57" width="270" height="55" rx="7" fill="#f7fafb" stroke="#304458" stroke-width="1.5"/><text x="280.0" y="91.5" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">电源总功率  EI</text><path d="M205 112 L120 153" fill="none" stroke="#304458" stroke-width="2.4" marker-end="url(#arr)"/><path d="M350 112 L380 153" fill="none" stroke="#147d92" stroke-width="2.4" marker-end="url(#arr)"/><rect x="20" y="164" width="200" height="58" rx="7" fill="#f7fafb" stroke="#b25132" stroke-width="1.5"/><text x="120.0" y="200.0" text-anchor="middle" style="font-size:20px;fill:#b25132;font-weight:400">内阻发热  I²r</text><rect x="265" y="164" width="275" height="58" rx="7" fill="#f7fafb" stroke="#147d92" stroke-width="1.5"/><text x="402.5" y="200.0" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400">电动机输入  UI</text><path d="M335 222 L230 271" fill="none" stroke="#304458" stroke-width="2.4" marker-end="url(#arr)"/><path d="M450 222 L450 271" fill="none" stroke="#147d92" stroke-width="2.4" marker-end="url(#arr)"/><rect x="105" y="282" width="205" height="58" rx="7" fill="#f7fafb" stroke="#b25132" stroke-width="1.5"/><text x="207.5" y="318.0" text-anchor="middle" style="font-size:20px;fill:#b25132;font-weight:400">线圈发热  I²R</text><rect x="330" y="282" width="210" height="58" rx="7" fill="#f7fafb" stroke="#147d92" stroke-width="1.5"/><text x="435.0" y="318.0" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400">机械功率</text><text x="435" y="371" text-anchor="middle" style="font-size:22px;fill:#147d92;font-weight:400">UI − I²R</text><text x="116" y="423" text-anchor="start" style="font-size:19px;fill:#304458;font-weight:400">电源输出功率 = 电动机输入功率 UI</text></svg>