<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="title desc"><title id="title">电容器的稳态电路与放电回路</title><desc id="desc">闭合开关稳定后 C 与 R1 并联，R1 R2 与电源构成回路。断开开关后 C 仅通过 R1 放电。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 1 L7 4 L0 7" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:20px;fill:#304458}.wire{fill:none;stroke:#304458;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="560" height="560" fill="white"/><text x="280" y="30" text-anchor="middle" style="font-size:21px;fill:#304458;font-weight:600">S 闭合并稳定：C 支路电流为 0</text><path d="M80 260 L80 100 L235 100" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M235 100 L254 100" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M306 100 L325 100" fill="none" stroke="#304458" stroke-width="2.4"/><rect x="254" y="90" width="52" height="20" fill="white" stroke="#304458" stroke-width="2.4"/><text x="280" y="77" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">R₁ = 3 Ω</text><path d="M325 100 L480 100 L480 260 L405 260" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M80 175 L245 175" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M245 175 L273 175" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M287 175 L315 175" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M273 153 L273 197" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M287 153 L287 197" fill="none" stroke="#147d92" stroke-width="2.4"/><text x="280" y="141" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400">C</text><path d="M315 175 L480 175" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M315 260 L334 260" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M386 260 L405 260" fill="none" stroke="#304458" stroke-width="2.4"/><rect x="334" y="250" width="52" height="20" fill="white" stroke="#304458" stroke-width="2.4"/><text x="360" y="237" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400"></text><text x="360" y="292" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">R₂ = 2 Ω</text><path d="M315 260 L200 260" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M120 260 L151 260" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M169 260 L200 260" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M151 238 L151 282" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M169 248 L169 272" fill="none" stroke="#304458" stroke-width="2.4"/><text x="160" y="306" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">E = 3 V，r = 1 Ω</text><text x="137" y="233" text-anchor="middle" style="font-size:18px;fill:#b25132;font-weight:400">+</text><path d="M120 260 L80 260" fill="none" stroke="#304458" stroke-width="2.4"/><text x="280" y="218" text-anchor="middle" style="font-size:21px;fill:#147d92;font-weight:400">U<tspan baseline-shift="sub" font-size="70%">C</tspan> = U<tspan baseline-shift="sub" font-size="70%">R₁</tspan> = 1.5 V</text><text x="280" y="342" text-anchor="middle" style="font-size:21px;fill:#304458;font-weight:600">S 断开后：C 只通过 R₁ 放电</text><path d="M100 490 L100 403 L235 403" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M235 403 L254 403" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M306 403 L325 403" fill="none" stroke="#304458" stroke-width="2.4"/><rect x="254" y="393" width="52" height="20" fill="white" stroke="#304458" stroke-width="2.4"/><text x="280" y="380" text-anchor="middle" style="font-size:20px;fill:#304458;font-weight:400">R₁</text><path d="M325 403 L460 403 L460 490 L315 490" fill="none" stroke="#304458" stroke-width="2.4"/><path d="M245 490 L273 490" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M287 490 L315 490" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M273 468 L273 512" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M287 468 L287 512" fill="none" stroke="#147d92" stroke-width="2.4"/><text x="280" y="456" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400">C</text><path d="M245 490 L100 490" fill="none" stroke="#147d92" stroke-width="2.4"/><path d="M145 375 L215 375" fill="none" stroke="#147d92" stroke-width="2.4" marker-end="url(#arr)"/><text x="100" y="470" text-anchor="middle" style="font-size:22px;fill:#b25132;font-weight:400">+</text><text x="462" y="470" text-anchor="middle" style="font-size:22px;fill:#147d92;font-weight:400">−</text><text x="280" y="543" text-anchor="middle" style="font-size:20px;fill:#147d92;font-weight:400">通过 R₁ 的电荷量 = 原有电荷量 Q</text></svg>