<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-labelledby="title desc"><title id="title">第11题 影子的位置</title><desc id="desc">t3 时刻光源在 −A，小球在 +A；光线过小球到达观测屏，由相似三角形得影子位移 5A。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#304458}</style><rect width="660" height="380" fill="white"/><path d="M560.0 60.0 L560.0 340.0" fill="none" stroke="#304458" stroke-width="3" stroke-linecap="round"/><text x="570.0" y="330.0" text-anchor="start" style="font-size:15px;fill:#304458;font-weight:400">观测屏</text><path d="M80.0 158.0 L80.0 272.0" fill="none" stroke="#dfe5ea" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M240.0 158.0 L240.0 272.0" fill="none" stroke="#dfe5ea" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M40.0 215.0 L560.0 215.0" fill="none" stroke="#8a99a8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><text x="46.0" y="207.0" text-anchor="start" style="font-size:14px;fill:#8a99a8;font-weight:400">平衡位置</text><path d="M80.0 242.0 L560.0 80.0" fill="none" stroke="#a36b00" stroke-width="2.2" stroke-linecap="round"/><polygon points="71,242 80,233 89,242 80,251" fill="#a36b00"/><text x="64.0" y="268.0" text-anchor="middle" style="font-size:15px;fill:#a36b00;font-weight:400">光源 −<tspan style="font-style:italic">A</tspan></text><circle cx="240.0" cy="188.0" r="10" fill="#e9eef2" stroke="#304458" stroke-width="2"/><text x="240.0" y="170.0" text-anchor="middle" style="font-size:15px;fill:#304458;font-weight:400">小球 +<tspan style="font-style:italic">A</tspan></text><circle cx="560.0" cy="80.0" r="6" fill="#b25132"/><text x="548.0" y="70.0" text-anchor="end" style="font-size:16px;fill:#b25132;font-weight:400">影子</text><path d="M80.0 320.0 L240.0 320.0" fill="none" stroke="#147d92" stroke-width="1.3" stroke-linecap="round"/><path d="M80.0 314.0 L80.0 326.0" fill="none" stroke="#147d92" stroke-width="1.3" stroke-linecap="round"/><path d="M240.0 314.0 L240.0 326.0" fill="none" stroke="#147d92" stroke-width="1.3" stroke-linecap="round"/><text x="160.0" y="340.0" text-anchor="middle" style="font-size:16px;fill:#147d92;font-weight:400"><tspan style="font-style:italic">l</tspan></text><path d="M240.0 320.0 L560.0 320.0" fill="none" stroke="#147d92" stroke-width="1.3" stroke-linecap="round"/><path d="M240.0 314.0 L240.0 326.0" fill="none" stroke="#147d92" stroke-width="1.3" stroke-linecap="round"/><path d="M560.0 314.0 L560.0 326.0" fill="none" stroke="#147d92" stroke-width="1.3" stroke-linecap="round"/><text x="400.0" y="340.0" text-anchor="middle" style="font-size:16px;fill:#147d92;font-weight:400">2<tspan style="font-style:italic">l</tspan></text><path d="M258.0 188.0 L258.0 242.0" fill="none" stroke="#6b4fa0" stroke-width="1.3" stroke-linecap="round"/><path d="M252.0 188.0 L264.0 188.0" fill="none" stroke="#6b4fa0" stroke-width="1.3" stroke-linecap="round"/><path d="M252.0 242.0 L264.0 242.0" fill="none" stroke="#6b4fa0" stroke-width="1.3" stroke-linecap="round"/><text x="268.0" y="220.0" text-anchor="start" style="font-size:15px;fill:#6b4fa0;font-weight:400">2<tspan style="font-style:italic">A</tspan></text><path d="M582.0 80.0 L582.0 242.0" fill="none" stroke="#6b4fa0" stroke-width="1.3" stroke-linecap="round"/><path d="M576.0 80.0 L588.0 80.0" fill="none" stroke="#6b4fa0" stroke-width="1.3" stroke-linecap="round"/><path d="M576.0 242.0 L588.0 242.0" fill="none" stroke="#6b4fa0" stroke-width="1.3" stroke-linecap="round"/><text x="592.0" y="166.0" text-anchor="start" style="font-size:15px;fill:#6b4fa0;font-weight:400"><tspan style="font-style:italic">A</tspan> + <tspan style="font-style:italic">y</tspan></text><text x="330.0" y="34.0" text-anchor="middle" style="font-size:16px;fill:#304458;font-weight:400">相似三角形：<tspan style="font-style:italic">l</tspan> : 3<tspan style="font-style:italic">l</tspan> = 2<tspan style="font-style:italic">A</tspan> : (<tspan style="font-style:italic">A</tspan> + <tspan style="font-style:italic">y</tspan>) → <tspan style="font-style:italic">y</tspan> = 5<tspan style="font-style:italic">A</tspan></text></svg>