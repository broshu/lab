<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-labelledby="title desc"><title id="title">第10题 摆长不同的两半个周期</title><desc id="desc">小球在 B 左侧以窗上沿为悬点（摆长 L=1 m），在右侧以房顶为悬点（摆长 L+h）；周期 T=(T1+T2)/2。</desc><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#304458}</style><rect width="560" height="460" fill="white"/><rect x="150" y="40" width="50" height="240" rx="0" fill="#dfe5ea" stroke="#304458" stroke-width="2"/><text x="175.0" y="160.0" text-anchor="middle" style="font-size:18px;fill:#304458;font-weight:400">墙</text><path d="M120.0 40.0 L330.0 40.0" fill="none" stroke="#304458" stroke-width="2.2" stroke-linecap="round"/><text x="330.0" y="32.0" text-anchor="end" style="font-size:15px;fill:#304458;font-weight:400">房顶</text><text x="140.0" y="286.0" text-anchor="end" style="font-size:15px;fill:#304458;font-weight:400">窗上沿</text><path d="M200.0 40.0 L200.0 280.0" fill="none" stroke="#8a99a8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M200.0 280.0 L200.0 390.0" fill="none" stroke="#8a99a8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M200.0 40.0 L242.7 387.4" fill="none" stroke="#304458" stroke-width="2" stroke-linecap="round"/><circle cx="242.7" cy="387.4" r="9" fill="#e9eef2" stroke="#304458" stroke-width="2"/><text x="260.7" y="393.4" text-anchor="start" style="font-size:17px;fill:#304458;font-weight:400">A</text><path d="M200.0 390.0 A350 350 0 0 0 242.7 387.4" fill="none" stroke="#147d92" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M200.0 280.0 L162.4 383.4" fill="none" stroke="#304458" stroke-width="2" stroke-linecap="round"/><circle cx="162.4" cy="383.4" r="9" fill="#e9eef2" stroke="#304458" stroke-width="2"/><text x="146.4" y="389.4" text-anchor="end" style="font-size:17px;fill:#304458;font-weight:400">C</text><path d="M162.4 383.4 A110 110 0 0 0 200.0 390.0" fill="none" stroke="#b25132" stroke-width="1.6" 