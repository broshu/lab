<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI tutor</title>
  <link rel="icon" type="image/png" href="../icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
        integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f7f7f5;
      --card: #fff;
      --ink: #111;
      --muted: #646464;
      --line: #d9d9d4;
      --soft-line: #ececea;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
    }

    main {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .home {
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .home:hover { color: var(--ink); text-decoration: underline; }

    .picker {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
    }

    .step { border-top: 1px solid var(--soft-line); padding: 14px 18px; }
    .step:first-child { border-top: 0; }
    .step[hidden] { display: none; }

    .step-label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
    }

    .chip:hover:not(:disabled) { border-color: var(--ink); }

    .chip[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }

    .chip:disabled {
      border-style: dashed;
      color: #b3b3ad;
      cursor: not-allowed;
    }

    .chip.num { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }

    .hint { margin: 18px 2px 0; color: var(--muted); font-size: 14px; }

    .answer-card {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
    }

    .answer-card[hidden] { display: none; }

    .answer-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--soft-line);
    }

    .crumb { color: var(--muted); font-size: 13px; }

    .badge {
      padding: 2px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
    }

    .answer-key {
      margin-left: auto;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }

    .answer-key b { font-size: 19px; letter-spacing: .06em; }

    .solution { padding: 4px 22px 22px; font-size: 15.5px; }
    .solution p { margin: 13px 0; }
    .solution strong { font-weight: 600; }
    .solution ul { margin: 13px 0; padding-left: 22px; }
    .solution li { margin: 5px 0; }

    .solution blockquote {
      margin: 18px 0;
      padding: 12px 16px;
      border-left: 3px solid var(--line);
      background: #fafaf8;
      color: #333;
      font-size: 14.5px;
    }

    .solution blockquote p:first-child { margin-top: 0; }
    .solution blockquote p:last-child { margin-bottom: 0; }

    .solution .math-block { margin: 16px 0; text-align: center; overflow-x: auto; }

    .solution table {
      display: block;
      width: max-content;
      max-width: 100%;
      margin: 16px 0;
      overflow-x: auto;
      border-collapse: collapse;
      font-size: 14.5px;
    }

    .solution th, .solution td {
      padding: 7px 14px;
      border: 1px solid var(--soft-line);
      text-align: left;
      white-space: nowrap;
    }

    .solution th { background: #fafaf8; font-weight: 600; }

    .nav {
      display: flex;
      gap: 10px;
      padding: 0 22px 20px;
    }

    .nav button {
      padding: 7px 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .nav button:hover:not(:disabled) { border-color: var(--ink); }
    .nav button:disabled { color: #b3b3ad; cursor: not-allowed; }

    @media (max-width: 560px) {
      main { width: calc(100% - 24px); padding: 20px 0 56px; }
      .solution { padding: 4px 16px 18px; font-size: 15px; }
      .answer-head { padding: 14px 16px; }
      .nav { padding: 0 16px 16px; }
      .step { padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <h1>AI tutor</h1>
      <a class="home" href="../">← Physics Lab</a>
    </div>

    <section class="picker">
      <div class="step">
        <span class="step-label">作业</span>
        <div class="chips" id="books"></div>
      </div>
      <div class="step" id="step-chapter" hidden>
        <span class="step-label">章节</span>
        <div class="chips" id="chapters"></div>
      </div>
      <div class="step" id="step-question" hidden>
        <span class="step-label">题号</span>
        <div class="chips" id="questions"></div>
      </div>
    </section>

    <p class="hint" id="hint">先选作业，再选章节和题号。</p>

    <article class="answer-card" id="answer" hidden>
      <div class="answer-head">
        <span class="crumb" id="crumb"></span>
        <span class="badge" id="badge"></span>
        <span class="answer-key">答案 <b id="key"></b></span>
      </div>
      <div class="solution" id="solution"></div>
      <div class="nav">
        <button type="button" id="prev">上一题</button>
        <button type="button" id="next">下一题</button>
      </div>
    </article>
  </main>

  <script src="data.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
          integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>

  <script>
    const data = window.TUTOR_DATA || { books: [] };
    const el = (id) => document.getElementById(id);

    const state = { book: null, chapter: null, question: null };

    function typeset(node) {
      if (!window.renderMathInElement) return;
      window.renderMathInElement(node, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    }

    function chip(label, { pressed = false, disabled = false, cls = "", onClick } = {}) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (cls ? " " + cls : "");
      b.textContent = label;
      b.setAttribute("aria-pressed", String(pressed));
      if (disabled) {
        b.disabled = true;
        b.title = "这一章还没整理";
      } else if (onClick) {
        b.addEventListener("click", onClick);
      }
      return b;
    }

    function currentBook() {
      return data.books.find((b) => b.id === state.book) || null;
    }

    function currentChapter() {
      const book = currentBook();
      return book ? book.chapters.find((c) => c.id === state.chapter) || null : null;
    }

    function renderBooks() {
      el("books").replaceChildren(...data.books.map((book) =>
        chip(book.title, {
          pressed: book.id === state.book,
          onClick: () => selectBook(book.id)
        })
      ));
    }

    function renderChapters() {
      const book = currentBook();
      const step = el("step-chapter");
      if (!book) { step.hidden = true; return; }
      step.hidden = false;
      el("chapters").replaceChildren(...book.chapters.map((ch) =>
        chip(ch.title, {
          pressed: ch.id === state.chapter,
          disabled: !ch.ready,
          onClick: () => selectChapter(ch.id)
        })
      ));
    }

    function renderQuestions() {
      const ch = currentChapter();
      const step = el("step-question");
      if (!ch) { step.hidden = true; return; }
      step.hidden = false;
      el("questions").replaceChildren(...ch.questions.map((q) =>
        chip(String(q.no), {
          pressed: q.no === state.question,
          cls: "num",
          onClick: () => selectQuestion(q.no)
        })
      ));
    }

    function renderSolution() {
      const ch = currentChapter();
      const card = el("answer");
      const q = ch && ch.questions.find((item) => item.no === state.question);

      if (!q) {
        card.hidden = true;
        el("hint").hidden = false;
        el("hint").textContent = ch ? "选一个题号，看这题的解析。"
          : (currentBook() ? "再选一个章节。" : "先选作业，再选章节和题号。");
        return;
      }

      el("hint").hidden = true;
      card.hidden = false;
      el("crumb").textContent = `${ch.title} · 第 ${q.no} 题`;
      const badge = el("badge");
      const tag = [q.type, q.section].filter(Boolean).join(" · ");
      badge.textContent = tag;
      badge.hidden = !tag;
      el("key").textContent = q.answer;

      const box = el("solution");
      box.innerHTML = q.html;
      typeset(box);

      const index = ch.questions.findIndex((item) => item.no === q.no);
      el("prev").disabled = index <= 0;
      el("next").disabled = index >= ch.questions.length - 1;
    }

    function syncUrl() {
      const params = new URLSearchParams();
      if (state.book) params.set("b", state.book);
      if (state.chapter) params.set("c", state.chapter);
      if (state.question) params.set("q", String(state.question));
      const qs = params.toString();
      history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
    }

    function selectBook(id) {
      state.book = id;
      state.chapter = null;
      state.question = null;
      renderBooks(); renderChapters(); renderQuestions(); renderSolution(); syncUrl();
    }

    function selectChapter(id) {
      state.chapter = id;
      state.question = null;
      renderChapters(); renderQuestions(); renderSolution(); syncUrl();
    }

    function selectQuestion(no) {
      state.question = no;
      renderQuestions(); renderSolution(); syncUrl();
      el("answer").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function step(delta) {
      const ch = currentChapter();
      if (!ch) return;
      const index = ch.questions.findIndex((item) => item.no === state.question);
      const target = ch.questions[index + delta];
      if (target) selectQuestion(target.no);
    }

    el("prev").addEventListener("click", () => step(-1));
    el("next").addEventListener("click", () => step(1));

    function boot() {
      const params = new URLSearchParams(location.search);
      const book = data.books.find((b) => b.id === params.get("b")) || data.books[0] || null;
      state.book = book ? book.id : null;

      const ch = book && book.chapters.find((c) => c.id === params.get("c") && c.ready);
      state.chapter = ch ? ch.id : null;

      const no = Number(params.get("q"));
      state.question = ch && ch.questions.some((item) => item.no === no) ? no : null;

      renderBooks(); renderChapters(); renderQuestions(); renderSolution();
    }

    boot();
    // KaTeX 是 defer 加载的，脚本就位后再补渲染一次。
    window.addEventListener("load", () => typeset(el("solution")));
  </script>
</body>
</html>
