<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作业答案与详解</title>
  <link rel="icon" type="image/png" href="../icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
        integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f7f7f5;
      --card: #fff;
      --ink: #111;
      --muted: #646464;
      --line: #d9d9d4;
      --soft-line: #ececea;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
    }

    main {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .home {
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .home:hover { color: var(--ink); text-decoration: underline; }

    .picker {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
    }

    .step { border-top: 1px solid var(--soft-line); padding: 14px 18px; }
    .step:first-child { border-top: 0; }
    .step[hidden] { display: none; }

    .step-label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
    }

    .chip:hover:not(:disabled) { border-color: var(--ink); }

    .chip[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }

    .chip:disabled {
      border-style: dashed;
      color: #b3b3ad;
      cursor: not-allowed;
    }

    .chip.num { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }

    .hint { margin: 18px 2px 0; color: var(--muted); font-size: 14px; }

    /* 显示题库构建时间：一眼就能看出浏览器是不是在用旧缓存 */
    .built { margin: 10px 2px 0; color: #a0a09a; font-size: 12px; }

    .answer-card {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
    }

    .answer-card[hidden] { display: none; }

    .answer-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--soft-line);
    }

    .crumb { color: var(--muted); font-size: 13px; }

    .badge {
      padding: 2px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
    }

    .answer-key {
      margin-left: auto;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }

    .answer-key b { font-size: 19px; letter-spacing: .06em; }

    .answer-key[hidden] { display: none; }

    .answer-block {
      margin: 16px 0 4px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fafaf8;
      font-size: 15px;
      overflow-x: auto;
    }

    .answer-block .tag {
      margin-right: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .solution { padding: 4px 22px 22px; font-size: 15.5px; }
    .solution p { margin: 13px 0; }
    .solution strong { font-weight: 600; }
    .solution ul { margin: 13px 0; padding-left: 22px; }
    .solution li { margin: 5px 0; }

    .solution-figure {
      margin: 20px 0;
      padding: 16px;
      border: 1px solid var(--soft-line);
      border-radius: 6px;
      background: #fff;
      text-align: center;
    }

    .solution-figure a {
      display: flex;
      justify-content: center;
      border-radius: 3px;
      cursor: zoom-in;
    }

    .solution-figure a:focus-visible { outline: 2px solid #167d8d; outline-offset: 5px; }
    .solution-figure img { display: block; max-width: 100%; width: auto; height: auto; max-height: 480px; object-fit: contain; }
    .solution-figure img[src*=".svg?"] { max-width: min(100%, 560px); max-height: none; }
    .solution-figure figcaption { margin-top: 12px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .figure-hint { display: block; margin-top: 3px; color: #767676; font-size: 12px; }

    .solution blockquote {
      margin: 18px 0;
      padding: 12px 16px;
      border-left: 3px solid var(--line);
      background: #fafaf8;
      color: #333;
      font-size: 14.5px;
    }

    .solution blockquote p:first-child { margin-top: 0; }
    .solution blockquote p:last-child { margin-bottom: 0; }

    .solution .math-block { margin: 16px 0; text-align: center; overflow-x: auto; }

    .solution table {
      display: block;
      width: max-content;
      max-width: 100%;
      margin: 16px 0;
      overflow-x: auto;
      border-collapse: collapse;
      font-size: 14.5px;
    }

    .solution th, .solution td {
      padding: 7px 14px;
      border: 1px solid var(--soft-line);
      text-align: left;
      white-space: nowrap;
    }

    .solution th { background: #fafaf8; font-weight: 600; }

    /* ---------- 模式切换 ---------- */

    .modes {
      display: inline-flex;
      margin-bottom: 14px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
    }

    .mode {
      padding: 5px 16px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .mode:hover { color: var(--ink); }
    .mode[aria-pressed="true"] { background: var(--ink); color: #fff; }

    /* ---------- 对答案总表 ---------- */

    .keysheet[hidden] { display: none; }

    .key-group-label {
      margin: 0 2px 10px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .key-chapter {
      margin-bottom: 14px;
      padding: 16px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
    }

    .key-chapter h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
    }

    .key-count { margin-left: 8px; color: var(--muted); font-size: 12px; font-weight: 400; }

    .key-sub {
      margin: 16px 0 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
    }

    /* 选择题：仿答题卡，题号在上、答案在下 */
    .key-grid { display: flex; flex-wrap: wrap; gap: 8px; }

    .key-cell {
      min-width: 54px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card);
      font-family: inherit;
      overflow: hidden;
      cursor: pointer;
    }

    .key-cell:hover { border-color: var(--ink); }
    .key-cell:focus-visible { outline: 2px solid #167d8d; outline-offset: 2px; }

    .key-cell .n {
      display: block;
      padding: 3px 6px;
      border-bottom: 1px solid var(--soft-line);
      background: #fafaf8;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .key-cell .a {
      display: block;
      padding: 7px 8px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .08em;
    }

    /* 非选择题：一行一题，显示最终答案 */
    .key-list { border-top: 1px solid var(--soft-line); }

    .key-row {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--soft-line);
    }

    .key-row .n {
      flex: none;
      width: 62px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }

    .key-row:hover { background: #f5f5f1; }
    .key-row:focus-visible { outline: 2px solid #167d8d; outline-offset: 2px; }

    .key-row .n:hover { color: var(--ink); text-decoration: underline; }
    .key-row .a { flex: 1; font-size: 15px; overflow-x: auto; }

    .key-empty { margin: 18px 2px; color: var(--muted); font-size: 14px; }

    .nav {
      display: flex;
      gap: 10px;
      padding: 0 22px 20px;
    }

    .nav button {
      padding: 7px 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .nav button:hover:not(:disabled) { border-color: var(--ink); }
    .nav button:disabled { color: #b3b3ad; cursor: not-allowed; }

    @media (max-width: 560px) {
      main { width: calc(100% - 24px); padding: 20px 0 56px; }
      .solution { padding: 4px 16px 18px; font-size: 15px; }
      .answer-head { padding: 14px 16px; }
      .nav { padding: 0 16px 16px; }
      .step { padding: 12px 14px; }
      .solution-figure { padding: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <div class="title-wrap">
        <h1>作业答案与详解</h1>
      </div>
      <a class="home" href="../">← Physics Lab</a>
    </div>

    <div class="modes" role="group" aria-label="页面模式">
      <button type="button" class="mode" id="mode-solution" aria-pressed="true">看解析</button>
      <button type="button" class="mode" id="mode-key" aria-pressed="false">对答案</button>
    </div>

    <section class="picker" id="picker">
      <div class="step">
        <span class="step-label">作业</span>
        <div class="chips" id="books"></div>
      </div>
      <div class="step" id="step-chapter" hidden>
        <span class="step-label">章节</span>
        <div class="chips" id="chapters"></div>
      </div>
      <div class="step" id="step-question" hidden>
        <span class="step-label">题号</span>
        <div class="chips" id="questions"></div>
      </div>
    </section>

    <p class="hint" id="hint">先选作业，再选章节和题号。</p>
    <p class="built" id="built"></p>

    <article class="answer-card" id="answer" hidden>
      <div class="answer-head">
        <span class="crumb" id="crumb"></span>
        <span class="badge" id="badge"></span>
        <span class="answer-key">答案 <b id="key"></b></span>
      </div>
      <div class="solution" id="solution"></div>
      <div class="nav">
        <button type="button" id="prev">上一题</button>
        <button type="button" id="next">下一题</button>
      </div>
    </article>

    <section class="keysheet" id="keysheet" hidden></section>

  </main>

  <script src="data.js?v=aa4c2547"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
          integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>

  <script>
    const data = window.HOMEWORK_DATA || { books: [] };
    const el = (id) => document.getElementById(id);

    const state = { view: "solution", book: null, chapter: null, question: null };


    function typeset(node) {
      if (!window.renderMathInElement) return;
      window.renderMathInElement(node, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    }

    function chip(label, { pressed = false, disabled = false, cls = "", onClick } = {}) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (cls ? " " + cls : "");
      b.textContent = label;
      b.setAttribute("aria-pressed", String(pressed));
      if (disabled) {
        b.disabled = true;
        b.title = "这一章还没整理";
      } else if (onClick) {
        b.addEventListener("click", onClick);
      }
      return b;
    }

    function currentBook() {
      return data.books.find((b) => b.id === state.book) || null;
    }

    function currentChapter() {
      const book = currentBook();
      return book ? book.chapters.find((c) => c.id === state.chapter) || null : null;
    }

    function renderBooks() {
      el("books").replaceChildren(...data.books.map((book) =>
        chip(book.title, {
          pressed: book.id === state.book,
          onClick: () => selectBook(book.id)
        })
      ));
    }

    function renderChapters() {
      const book = currentBook();
      const step = el("step-chapter");
      if (!book) { step.hidden = true; return; }
      step.hidden = false;
      el("chapters").replaceChildren(...book.chapters.map((ch) =>
        chip(ch.title, {
          pressed: ch.id === state.chapter,
          disabled: !ch.ready,
          onClick: () => selectChapter(ch.id)
        })
      ));
    }

    function renderQuestions() {
      const ch = currentChapter();
      const step = el("step-question");
      if (!ch) { step.hidden = true; return; }
      step.hidden = false;
      el("questions").replaceChildren(...ch.questions.map((q) =>
        chip(String(q.no), {
          pressed: q.no === state.question,
          cls: "num",
          onClick: () => selectQuestion(q.no)
        })
      ));
    }

    function renderSolution() {
      const ch = currentChapter();
      const card = el("answer");
      const q = ch && ch.questions.find((item) => item.no === state.question);

      if (!q) {
        card.hidden = true;
        el("hint").hidden = false;
        el("hint").textContent = ch ? "选一个题号，看这题的解析。"
          : (currentBook() ? "再选一个章节。" : "先选作业，再选章节和题号。");
        return;
      }

      el("hint").hidden = true;
      card.hidden = false;
      el("crumb").textContent = `${ch.title} · 第 ${q.no} 题`;
      const badge = el("badge");
      const tag = [q.type, q.section].filter(Boolean).join(" · ");
      badge.textContent = tag;
      badge.hidden = !tag;

      // 选择题答案短，直接放标题栏；计算题答案是一串公式，放正文顶部的方框里。
      const inHead = q.answer.length <= 14 && !q.answer.includes("$");
      const keyWrap = document.querySelector(".answer-key");
      keyWrap.hidden = !inHead;
      el("key").textContent = inHead ? q.answer : "";

      const box = el("solution");
      box.innerHTML = q.html;
      if (!inHead) {
        const block = document.createElement("div");
        block.className = "answer-block";
        block.innerHTML = '<span class="tag">答案</span>' + q.answer;
        box.prepend(block);
      }
      typeset(el("answer"));

      const index = ch.questions.findIndex((item) => item.no === q.no);
      el("prev").disabled = index <= 0;
      el("next").disabled = index >= ch.questions.length - 1;

    }

    /* =================== 当前章节答案 =================== */

    // 选择题只要核对字母；实验、填空、计算题要看完整的最终答案。
    function isChoice(q) {
      return /选/.test(q.type || "") || /^[A-Z]{1,4}$/.test(q.answer || "");
    }

    function openQuestion(chapterId, no) {
      state.chapter = chapterId;
      state.question = no;
      renderBooks(); renderChapters(); renderQuestions();
      setView("solution");
      el("answer").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function keyCell(ch, q) {
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "key-cell";
      cell.title = `看第 ${q.no} 题的解析`;
      const no = document.createElement("span");
      no.className = "n";
      no.textContent = q.no;
      const ans = document.createElement("span");
      ans.className = "a";
      ans.textContent = q.answer;
      cell.append(no, ans);
      cell.addEventListener("click", () => openQuestion(ch.id, q.no));
      return cell;
    }

    function keyRow(ch, q) {
      const row = document.createElement("a");
      row.className = "key-row";
      row.href = `?b=${encodeURIComponent(state.book)}&c=${encodeURIComponent(ch.id)}&q=${q.no}`;
      row.title = `看第 ${q.no} 题的详解`;
      row.addEventListener("click", (event) => {
        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        openQuestion(ch.id, q.no);
      });
      const no = document.createElement("span");
      no.className = "n";
      no.textContent = `第 ${q.no} 题`;
      no.title = `看第 ${q.no} 题的解析`;
      const ans = document.createElement("div");
      ans.className = "a";
      // answer 在 build 时已转义，里面的 LaTeX 交给 KaTeX 渲染
      ans.innerHTML = q.answer;
      row.append(no, ans);
      return row;
    }

    function keyChapterCard(ch) {
      const card = document.createElement("section");
      card.className = "key-chapter";

      const title = document.createElement("h2");
      title.textContent = ch.title;
      const count = document.createElement("span");
      count.className = "key-count";
      count.textContent = `${ch.questions.length} 题`;
      title.append(count);
      card.append(title);

      const choice = ch.questions.filter(isChoice);
      const written = ch.questions.filter((q) => !isChoice(q));

      if (choice.length) {
        const label = document.createElement("p");
        label.className = "key-sub";
        label.textContent = "选择题";
        const grid = document.createElement("div");
        grid.className = "key-grid";
        grid.append(...choice.map((q) => keyCell(ch, q)));
        card.append(label, grid);
      }

      if (written.length) {
        const label = document.createElement("p");
        label.className = "key-sub";
        label.textContent = "非选择题";
        const list = document.createElement("div");
        list.className = "key-list";
        list.append(...written.map((q) => keyRow(ch, q)));
        card.append(label, list);
      }

      return card;
    }

    function renderKeySheet() {
      const sheet = el("keysheet");
      const book = currentBook();
      const ch = currentChapter();

      if (!ch || !ch.ready) {
        const empty = document.createElement("p");
        empty.className = "key-empty";
        empty.textContent = book ? "选一个章节，核对本节答案。" : "先选作业，再选章节核对答案。";
        sheet.replaceChildren(empty);
        return;
      }

      const label = document.createElement("p");
      label.className = "key-group-label";
      label.textContent = [book.title, ch.group].filter(Boolean).join(" · ");
      sheet.replaceChildren(label, keyChapterCard(ch));
      typeset(sheet);
    }

    function setView(view) {
      state.view = view === "key" ? "key" : "solution";
      const onKey = state.view === "key";
      el("mode-solution").setAttribute("aria-pressed", String(!onKey));
      el("mode-key").setAttribute("aria-pressed", String(onKey));
      el("picker").hidden = false;
      el("step-chapter").hidden = !currentBook();
      el("step-question").hidden = onKey || !currentChapter();
      el("keysheet").hidden = !onKey;
      if (onKey) {
        el("answer").hidden = true;
        el("hint").hidden = true;
        renderKeySheet();
      } else {
        renderSolution();
      }
      syncUrl();
    }

    el("mode-solution").addEventListener("click", () => setView("solution"));
    el("mode-key").addEventListener("click", () => setView("key"));

    function syncUrl() {
      const params = new URLSearchParams();
      if (state.view === "key") params.set("view", "key");
      if (state.book) params.set("b", state.book);
      if (state.chapter) params.set("c", state.chapter);
      if (state.question) params.set("q", String(state.question));
      const qs = params.toString();
      history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
    }

    function selectBook(id) {
      state.book = id;
      state.chapter = null;
      state.question = null;
      renderBooks(); renderChapters(); renderQuestions(); setView(state.view);
    }

    function selectChapter(id) {
      state.chapter = id;
      state.question = null;
      renderChapters(); renderQuestions(); setView(state.view);
    }

    function selectQuestion(no) {
      state.question = no;
      renderQuestions(); renderSolution(); syncUrl();
      el("answer").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function step(delta) {
      const ch = currentChapter();
      if (!ch) return;
      const index = ch.questions.findIndex((item) => item.no === state.question);
      const target = ch.questions[index + delta];
      if (target) selectQuestion(target.no);
    }

    el("prev").addEventListener("click", () => step(-1));
    el("next").addEventListener("click", () => step(1));

    function boot() {
      const ready = data.books.reduce((n, b) => n + b.chapters.filter((c) => c.ready).length, 0);
      el("built").textContent = `题库更新于 ${data.built || "未知"} · 已整理 ${ready} 个章节`;

      const params = new URLSearchParams(location.search);
      const book = data.books.find((b) => b.id === params.get("b")) || data.books[0] || null;
      state.book = book ? book.id : null;

      const ch = book && book.chapters.find((c) => c.id === params.get("c") && c.ready);
      state.chapter = ch ? ch.id : null;

      const no = Number(params.get("q"));
      state.question = ch && ch.questions.some((item) => item.no === no) ? no : null;

      renderBooks(); renderChapters(); renderQuestions();
      setView(params.get("view") === "key" ? "key" : "solution");
    }

    boot();
    // KaTeX 是 defer 加载的，脚本就位后再补渲染一次。
    window.addEventListener("load", () => {
      typeset(el("answer"));
      typeset(el("keysheet"));
    });
  </script>
</body>
</html>
