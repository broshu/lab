<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI tutor</title>
  <link rel="icon" type="image/png" href="../icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
        integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f7f7f5;
      --card: #fff;
      --ink: #111;
      --muted: #646464;
      --line: #d9d9d4;
      --soft-line: #ececea;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
    }

    main {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0;
    }

    /* A deliberately quiet, password-protected teacher entry. */
    .admin-entry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 5px;
      color: var(--muted);
      opacity: .32;
      text-decoration: none;
      transition: opacity .16s ease, background .16s ease, color .16s ease;
    }

    .admin-entry:hover,
    .admin-entry:focus-visible {
      color: var(--ink);
      background: #ececea;
      opacity: 1;
      outline: none;
    }

    .home {
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .home:hover { color: var(--ink); text-decoration: underline; }

    .picker {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
    }

    .step { border-top: 1px solid var(--soft-line); padding: 14px 18px; }
    .step:first-child { border-top: 0; }
    .step[hidden] { display: none; }

    .step-label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
    }

    .chip:hover:not(:disabled) { border-color: var(--ink); }

    .chip[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }

    .chip:disabled {
      border-style: dashed;
      color: #b3b3ad;
      cursor: not-allowed;
    }

    .chip.num { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }

    .hint { margin: 18px 2px 0; color: var(--muted); font-size: 14px; }

    /* 显示题库构建时间：一眼就能看出浏览器是不是在用旧缓存 */
    .built { margin: 10px 2px 0; color: #a0a09a; font-size: 12px; }

    .answer-card {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
    }

    .answer-card[hidden] { display: none; }

    .answer-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--soft-line);
    }

    .crumb { color: var(--muted); font-size: 13px; }

    .badge {
      padding: 2px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
    }

    .answer-key {
      margin-left: auto;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }

    .answer-key b { font-size: 19px; letter-spacing: .06em; }

    .answer-key[hidden] { display: none; }

    .answer-block {
      margin: 16px 0 4px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fafaf8;
      font-size: 15px;
      overflow-x: auto;
    }

    .answer-block .tag {
      margin-right: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .solution { padding: 4px 22px 22px; font-size: 15.5px; }
    .solution p { margin: 13px 0; }
    .solution strong { font-weight: 600; }
    .solution ul { margin: 13px 0; padding-left: 22px; }
    .solution li { margin: 5px 0; }

    .solution-figure {
      margin: 20px 0;
      padding: 16px;
      border: 1px solid var(--soft-line);
      border-radius: 6px;
      background: #fff;
      text-align: center;
    }

    .solution-figure a {
      display: flex;
      justify-content: center;
      border-radius: 3px;
      cursor: zoom-in;
    }

    .solution-figure a:focus-visible { outline: 2px solid #167d8d; outline-offset: 5px; }
    .solution-figure img { display: block; max-width: 100%; width: auto; height: auto; max-height: 480px; object-fit: contain; }
    .solution-figure img[src*=".svg?"] { max-width: min(100%, 560px); max-height: none; }
    .solution-figure figcaption { margin-top: 12px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .figure-hint { display: block; margin-top: 3px; color: #767676; font-size: 12px; }

    .solution blockquote {
      margin: 18px 0;
      padding: 12px 16px;
      border-left: 3px solid var(--line);
      background: #fafaf8;
      color: #333;
      font-size: 14.5px;
    }

    .solution blockquote p:first-child { margin-top: 0; }
    .solution blockquote p:last-child { margin-bottom: 0; }

    .solution .math-block { margin: 16px 0; text-align: center; overflow-x: auto; }

    .solution table {
      display: block;
      width: max-content;
      max-width: 100%;
      margin: 16px 0;
      overflow-x: auto;
      border-collapse: collapse;
      font-size: 14.5px;
    }

    .solution th, .solution td {
      padding: 7px 14px;
      border: 1px solid var(--soft-line);
      text-align: left;
      white-space: nowrap;
    }

    .solution th { background: #fafaf8; font-weight: 600; }

    /* ---------- 问 AI ---------- */

    .chat {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
    }

    .chat[hidden] { display: none; }

    .chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--soft-line);
      font-size: 14px;
      font-weight: 600;
    }

    .chat-clear {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
    }

    .chat-clear:hover { color: var(--ink); text-decoration: underline; }
    .chat-clear[hidden] { display: none; }

    .chat-log { padding: 6px 22px; }
    .chat-log:empty { display: none; }

    .msg { margin: 14px 0; font-size: 15px; }
    .msg p { margin: 9px 0; }
    .msg p:first-child { margin-top: 0; }
    .msg p:last-child { margin-bottom: 0; }
    .msg ul, .msg ol { margin: 9px 0; padding-left: 22px; }
    .msg .math-block { margin: 12px 0; text-align: center; overflow-x: auto; }

    .msg.me {
      margin-left: auto;
      max-width: 86%;
      width: fit-content;
      padding: 9px 14px;
      border-radius: 14px 14px 3px 14px;
      background: #ececea;
      white-space: pre-wrap;
    }

    .msg.ai { color: #1a1a1a; }

    .msg.ai .who {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
    }

    .msg.err { color: #a3341f; font-size: 14px; }

    .thinking { color: var(--muted); font-size: 14px; }

    .thinking::after {
      content: "";
      animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "·"; }
      50% { content: "··"; }
      75% { content: "···"; }
    }

    .chat-input {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 14px 22px 18px;
    }

    .chat-input textarea {
      flex: 1;
      min-height: 40px;
      max-height: 160px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card);
      color: var(--ink);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
    }

    .chat-input textarea:focus { border-color: var(--ink); outline: none; }

    .chat-input button {
      padding: 9px 18px;
      border: 1px solid var(--ink);
      border-radius: 6px;
      background: var(--ink);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .chat-input button:disabled {
      border-color: var(--line);
      background: var(--line);
      color: #fff;
      cursor: not-allowed;
    }

    .nav {
      display: flex;
      gap: 10px;
      padding: 0 22px 20px;
    }

    .nav button {
      padding: 7px 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .nav button:hover:not(:disabled) { border-color: var(--ink); }
    .nav button:disabled { color: #b3b3ad; cursor: not-allowed; }

    @media (max-width: 560px) {
      main { width: calc(100% - 24px); padding: 20px 0 56px; }
      .solution { padding: 4px 16px 18px; font-size: 15px; }
      .answer-head { padding: 14px 16px; }
      .nav { padding: 0 16px 16px; }
      .step { padding: 12px 14px; }
      .solution-figure { padding: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <div class="title-wrap">
        <h1>AI tutor</h1>
        <a class="admin-entry" href="https://p-ai-tutor.dgxwmk9dbm.workers.dev/admin" target="_blank" rel="noopener" aria-label="打开教师后台" title="教师后台"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></a>
      </div>
      <a class="home" href="../">← Physics Lab</a>
    </div>

    <section class="picker">
      <div class="step">
        <span class="step-label">作业</span>
        <div class="chips" id="books"></div>
      </div>
      <div class="step" id="step-chapter" hidden>
        <span class="step-label">章节</span>
        <div class="chips" id="chapters"></div>
      </div>
      <div class="step" id="step-question" hidden>
        <span class="step-label">题号</span>
        <div class="chips" id="questions"></div>
      </div>
    </section>

    <p class="hint" id="hint">先选作业，再选章节和题号。</p>
    <p class="built" id="built"></p>

    <article class="answer-card" id="answer" hidden>
      <div class="answer-head">
        <span class="crumb" id="crumb"></span>
        <span class="badge" id="badge"></span>
        <span class="answer-key">答案 <b id="key"></b></span>
      </div>
      <div class="solution" id="solution"></div>
      <div class="nav">
        <button type="button" id="prev">上一题</button>
        <button type="button" id="next">下一题</button>
      </div>
    </article>

    <section class="chat" id="chat" hidden>
      <div class="chat-head">
        <span>没看懂？问问 AI</span>
        <button type="button" class="chat-clear" id="chat-clear" hidden>清空对话</button>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <form class="chat-input" id="chat-form">
        <textarea id="chat-text" rows="1"></textarea>
        <button type="submit" id="chat-send">发送</button>
      </form>
    </section>
  </main>

  <script src="data.js?v=9bb0fc9c"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
          integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>

  <script>
    const data = window.TUTOR_DATA || { books: [] };
    const el = (id) => document.getElementById(id);

    const state = { book: null, chapter: null, question: null };

    function typeset(node) {
      if (!window.renderMathInElement) return;
      window.renderMathInElement(node, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    }

    function chip(label, { pressed = false, disabled = false, cls = "", onClick } = {}) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (cls ? " " + cls : "");
      b.textContent = label;
      b.setAttribute("aria-pressed", String(pressed));
      if (disabled) {
        b.disabled = true;
        b.title = "这一章还没整理";
      } else if (onClick) {
        b.addEventListener("click", onClick);
      }
      return b;
    }

    function currentBook() {
      return data.books.find((b) => b.id === state.book) || null;
    }

    function currentChapter() {
      const book = currentBook();
      return book ? book.chapters.find((c) => c.id === state.chapter) || null : null;
    }

    function renderBooks() {
      el("books").replaceChildren(...data.books.map((book) =>
        chip(book.title, {
          pressed: book.id === state.book,
          onClick: () => selectBook(book.id)
        })
      ));
    }

    function renderChapters() {
      const book = currentBook();
      const step = el("step-chapter");
      if (!book) { step.hidden = true; return; }
      step.hidden = false;
      el("chapters").replaceChildren(...book.chapters.map((ch) =>
        chip(ch.title, {
          pressed: ch.id === state.chapter,
          disabled: !ch.ready,
          onClick: () => selectChapter(ch.id)
        })
      ));
    }

    function renderQuestions() {
      const ch = currentChapter();
      const step = el("step-question");
      if (!ch) { step.hidden = true; return; }
      step.hidden = false;
      el("questions").replaceChildren(...ch.questions.map((q) =>
        chip(String(q.no), {
          pressed: q.no === state.question,
          cls: "num",
          onClick: () => selectQuestion(q.no)
        })
      ));
    }

    function renderSolution() {
      const ch = currentChapter();
      const card = el("answer");
      const q = ch && ch.questions.find((item) => item.no === state.question);

      if (!q) {
        card.hidden = true;
        el("chat").hidden = true;
        el("hint").hidden = false;
        el("hint").textContent = ch ? "选一个题号，看这题的解析。"
          : (currentBook() ? "再选一个章节。" : "先选作业，再选章节和题号。");
        return;
      }

      el("hint").hidden = true;
      card.hidden = false;
      el("crumb").textContent = `${ch.title} · 第 ${q.no} 题`;
      const badge = el("badge");
      const tag = [q.type, q.section].filter(Boolean).join(" · ");
      badge.textContent = tag;
      badge.hidden = !tag;

      // 选择题答案短，直接放标题栏；计算题答案是一串公式，放正文顶部的方框里。
      const inHead = q.answer.length <= 14 && !q.answer.includes("$");
      const keyWrap = document.querySelector(".answer-key");
      keyWrap.hidden = !inHead;
      el("key").textContent = inHead ? q.answer : "";

      const box = el("solution");
      box.innerHTML = q.html;
      if (!inHead) {
        const block = document.createElement("div");
        block.className = "answer-block";
        block.innerHTML = '<span class="tag">答案</span>' + q.answer;
        box.prepend(block);
      }
      typeset(el("answer"));

      const index = ch.questions.findIndex((item) => item.no === q.no);
      el("prev").disabled = index <= 0;
      el("next").disabled = index >= ch.questions.length - 1;

      mountChat(ch, q);
    }

    function syncUrl() {
      const params = new URLSearchParams();
      if (state.book) params.set("b", state.book);
      if (state.chapter) params.set("c", state.chapter);
      if (state.question) params.set("q", String(state.question));
      const qs = params.toString();
      history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
    }

    function selectBook(id) {
      state.book = id;
      state.chapter = null;
      state.question = null;
      renderBooks(); renderChapters(); renderQuestions(); renderSolution(); syncUrl();
    }

    function selectChapter(id) {
      state.chapter = id;
      state.question = null;
      renderChapters(); renderQuestions(); renderSolution(); syncUrl();
    }

    function selectQuestion(no) {
      state.question = no;
      renderQuestions(); renderSolution(); syncUrl();
      el("answer").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function step(delta) {
      const ch = currentChapter();
      if (!ch) return;
      const index = ch.questions.findIndex((item) => item.no === state.question);
      const target = ch.questions[index + delta];
      if (target) selectQuestion(target.no);
    }

    el("prev").addEventListener("click", () => step(-1));
    el("next").addEventListener("click", () => step(1));

    /* =================== 问 AI =================== */

    // 密钥仅保存在 Cloudflare Worker。浏览器只和本站的 AI Tutor 接口通信。
    const AI = {
      endpoint: "https://p-ai-tutor.dgxwmk9dbm.workers.dev/api/chat"
    };

    const histories = new Map();   // 每道题一份对话记录
    let chatKey = null;
    let inflight = null;           // 当前请求的 AbortController

    const SESSION_STORAGE_KEY = "p-ai-tutor-session";
    const SESSION_ID_RE = /^[A-Za-z0-9_-]{8,80}$/;

    function fallbackSessionId() {
      return "tutor-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 14);
    }

    function getSessionId() {
      let value = "";
      try { value = sessionStorage.getItem(SESSION_STORAGE_KEY) || ""; } catch {}
      if (!SESSION_ID_RE.test(value)) {
        value = crypto.randomUUID ? crypto.randomUUID() : fallbackSessionId();
        if (!SESSION_ID_RE.test(value)) value = fallbackSessionId();
        try { sessionStorage.setItem(SESSION_STORAGE_KEY, value); } catch {}
      }
      return value;
    }

    const sessionId = getSessionId();

    // 极简 markdown：段落、**粗体**、无序/有序列表、$$块级公式$$
    function mdLite(text) {
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      return text.trim().split(/\n\s*\n/).map((block) => {
        const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
        if (!lines.length) return "";
        const body = esc(block.trim());
        if (body.startsWith("$$") && body.endsWith("$$")) {
          return `<p class="math-block">${body}</p>`;
        }
        const bold = (s) => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        if (lines.every((l) => /^[-*]\s+/.test(l))) {
          return "<ul>" + lines.map((l) => `<li>${bold(esc(l.replace(/^[-*]\s+/, "")))}</li>`).join("") + "</ul>";
        }
        if (lines.every((l) => /^\d+[.、)]\s*/.test(l))) {
          return "<ol>" + lines.map((l) => `<li>${bold(esc(l.replace(/^\d+[.、)]\s*/, "")))}</li>`).join("") + "</ol>";
        }
        return `<p>${bold(esc(lines.join("\n"))).replace(/\n/g, "<br>")}</p>`;
      }).join("");
    }

    function systemPrompt(ch, q) {
      const book = currentBook();
      return [
        "你是一位耐心的高中物理老师，正在给一名中国高中学生讲解一道他刚做过的题。",
        "",
        "下面是这道题的全部信息，包括题干、选项、标准答案和详细解析：",
        "",
        "<题目资料>",
        book ? `所属作业本：${book.title}` : "",
        `所属章节：${ch.title}`,
        `题号：第 ${q.no} 题${q.type ? "（" + q.type + "）" : ""}`,
        q.section ? `考点分类：${q.section}` : "",
        "",
        q.source,
        "</题目资料>",
        "",
        "回答时请遵守：",
        "1. 学生手上有纸质作业本，题目和插图他都看得到，不要复述题干，直接回答他问的点。",
        "2. 以上面这份解析为准。学生的疑问如果超出解析范围，你可以补充，但结论不能和标准答案矛盾。",
        "3. 上面的资料里没有插图，只有少数题给了「图示说明」这样的文字描述。如果某个问题必须看图才能说清，而资料里又没有对应的文字描述，就让学生描述一下图里的关键信息，不要凭空猜测图的样子。",
        "4. 用中文口语化地讲，像当面辅导。一次讲清一个点就够了，不要把整道题从头到尾重讲一遍。",
        "5. 公式一律用 LaTeX：行内写成 $E=mc^2$，独立成行写成 $$E=mc^2$$。不要用其他记法。",
        "6. 学生问「为什么选 X」时，先给结论，再解释理由。",
        "7. 学生说自己选了别的选项时，先指出他那个选项错在哪一步，这比重复正确答案更有用。",
        "8. 拿不准就说拿不准，不要编造数据或结论。"
      ].filter(Boolean).join("\n");
    }

    function addMsg(cls, html) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.innerHTML = html;
      el("chat-log").append(div);
      return div;
    }

    // 有对话记录时才显示「清空对话」
    function refreshClear() {
      const hist = histories.get(chatKey) || [];
      el("chat-clear").hidden = hist.length === 0;
    }

    function drawHistory() {
      const log = el("chat-log");
      log.replaceChildren();
      for (const m of histories.get(chatKey) || []) {
        if (m.role === "user") {
          addMsg("me", mdLite(m.content));
        } else {
          addMsg("ai", '<span class="who">AI</span>' + mdLite(m.content));
        }
      }
      typeset(log);
      refreshClear();
    }

    function mountChat(ch, q) {
      // 有的作业本只录了解析、没有题干。没有题目原文，AI 只能瞎猜，干脆不显示。
      if (!q.source) {
        if (inflight) { inflight.abort(); inflight = null; }
        chatKey = null;
        el("chat").hidden = true;
        return;
      }
      const key = `${ch.id}#${q.no}`;
      el("chat").hidden = false;
      if (key === chatKey) return;
      if (inflight) { inflight.abort(); inflight = null; }
      chatKey = key;
      el("chat-text").value = "";
      drawHistory();
    }

    async function ask(text) {
      const ch = currentChapter();
      const q = ch && ch.questions.find((item) => item.no === state.question);
      if (!q || !text.trim() || inflight) return;

      const hist = histories.get(chatKey) || [];
      histories.set(chatKey, hist);
      hist.push({ role: "user", content: text.trim() });

      addMsg("me", mdLite(text.trim()));
      refreshClear();

      const bubble = addMsg("ai", '<span class="who">AI</span><span class="thinking">思考中</span>');
      const body = bubble.appendChild(document.createElement("div"));
      bubble.scrollIntoView({ behavior: "smooth", block: "nearest" });

      el("chat-send").disabled = true;
      inflight = new AbortController();
      const askedFor = chatKey;
      let answer = "";

      try {
        const book = currentBook();
        let res;
        try {
          res = await fetch(AI.endpoint, {
          method: "POST",
          signal: inflight.signal,
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question: text.trim(),
            sessionId,
            context: {
              bookId: book?.id || "",
              bookTitle: book?.title || "",
              chapterId: ch.id,
              chapterTitle: ch.title,
              questionNo: q.no,
              questionType: q.type || ""
            },
            messages: [{ role: "system", content: systemPrompt(ch, q) }, ...hist]
          })
          });
        } catch (netErr) {
          // 只有连不上（断网、接口挂了）才会走到这里；AbortError 交给外层处理。
          if (netErr.name === "AbortError") throw netErr;
          throw new Error("连不上 AI，检查一下网络，稍后再试。");
        }

        let payload;
        try { payload = await res.json(); } catch { throw new Error("AI 返回了无法读取的内容，再问一次试试。"); }
        if (!res.ok) throw new Error(payload?.error || `接口返回 ${res.status}`);
        answer = typeof payload?.answer === "string" ? payload.answer : "";

        if (askedFor !== chatKey) return;   // 学生中途换题了

        if (answer.trim()) {
          hist.push({ role: "assistant", content: answer });
          const dots = bubble.querySelector(".thinking");
          if (dots) dots.remove();
          body.innerHTML = mdLite(answer);  // 结束后再排版公式
          typeset(body);
        } else {
          bubble.remove();
          addMsg("err", "没有收到回复，再问一次试试。");
        }
      } catch (err) {
        if (err.name === "AbortError") return;
        bubble.remove();
        // 接口已经会给出具体原因（密钥失效／余额不足／限流…），照原样显示即可，
        // 再拼一句「检查网络」反而会把真正的原因盖掉。
        addMsg("err", err.message || "AI 暂时用不了，稍后再试。");
        hist.pop();   // 这轮没成功，别把提问留在记录里
      } finally {
        if (askedFor === chatKey) {
          inflight = null;
          el("chat-send").disabled = false;
          refreshClear();
        }
      }
    }

    el("chat-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const box = el("chat-text");
      const text = box.value;
      box.value = "";
      box.style.height = "auto";
      ask(text);
    });

    el("chat-text").addEventListener("input", (e) => {
      e.target.style.height = "auto";
      e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px";
    });

    el("chat-text").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        el("chat-form").requestSubmit();
      }
    });

    el("chat-clear").addEventListener("click", () => {
      if (inflight) { inflight.abort(); inflight = null; }
      histories.delete(chatKey);
      el("chat-send").disabled = false;
      drawHistory();
    });

    function boot() {
      const ready = data.books.reduce((n, b) => n + b.chapters.filter((c) => c.ready).length, 0);
      el("built").textContent = `题库更新于 ${data.built || "未知"} · 已整理 ${ready} 个章节`;

      const params = new URLSearchParams(location.search);
      const book = data.books.find((b) => b.id === params.get("b")) || data.books[0] || null;
      state.book = book ? book.id : null;

      const ch = book && book.chapters.find((c) => c.id === params.get("c") && c.ready);
      state.chapter = ch ? ch.id : null;

      const no = Number(params.get("q"));
      state.question = ch && ch.questions.some((item) => item.no === no) ? no : null;

      renderBooks(); renderChapters(); renderQuestions(); renderSolution();
    }

    boot();
    // KaTeX 是 defer 加载的，脚本就位后再补渲染一次。
    window.addEventListener("load", () => typeset(el("answer")));
  </script>
</body>
</html>
