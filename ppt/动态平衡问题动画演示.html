<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动态平衡问题动画演示</title>
<style>
/* 三道例题各一个动画：左边是实物受力图，右边是力的封闭三角形、数值读数和变化曲线。 */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --stage:#F7FAF9; --ink:#10252C; --muted:#546A72; --line:#CFDAD8;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --soft:#DCEEEF;
  --c-g:#B9770E; --c-a:#0E7C86; --c-b:#C0392B; --c-n:#6C4BB8; --ok:#1E7B3A; --ok-bg:#E1F3E6; --warn:#B3470F;
  --wall:#D9DEDD; --wall-line:#B7C0BE; --ground:#8A9A97;
  --font-body:'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  --font-num:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1B20; --surface:#14262D; --stage:#102128; --ink:#E6EFEE; --muted:#93A9AF; --line:#284048;
  --accent:#4FC3CC; --accent-ink:#082A2E; --soft:#1B3A41;
  --c-g:#E3A04F; --c-a:#4FC3CC; --c-b:#FF7B6B; --c-n:#B79CFF; --ok:#7BD99A; --ok-bg:#16352330; --warn:#F0A36B;
  --wall:#27393F; --wall-line:#3A5058; --ground:#6E8581; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1B20; --surface:#14262D; --stage:#102128; --ink:#E6EFEE; --muted:#93A9AF; --line:#284048;
  --accent:#4FC3CC; --accent-ink:#082A2E; --soft:#1B3A41;
  --c-g:#E3A04F; --c-a:#4FC3CC; --c-b:#FF7B6B; --c-n:#B79CFF; --ok:#7BD99A; --ok-bg:#16352330; --warn:#F0A36B;
  --wall:#27393F; --wall-line:#3A5058; --ground:#6E8581; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;margin:0;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:28px;line-height:1.2;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0 0 16px}
h2{font-size:17px;margin:0 0 8px}
i,.v{font-family:'Times New Roman','Songti SC',serif;font-style:italic}
sub{font-size:.72em;line-height:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;
  padding:8px 14px;border-radius:10px;cursor:pointer;min-height:44px}
.tab small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab[aria-selected="true"] small{color:var(--accent-ink);opacity:.85}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.col{display:grid;gap:14px}
svg{display:block;width:100%;height:auto;background:var(--stage);border-radius:10px}
svg text{font-family:'Times New Roman','Songti SC',serif;fill:var(--ink)}
svg text.cn{font-family:var(--font-body);font-size:12px;fill:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;
  padding:6px 14px;border-radius:9px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
input[type=range]{flex:1 1 180px;min-width:140px;accent-color:var(--accent);height:44px}
.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.cell{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--stage)}
.cell .nm{font-size:14px;color:var(--muted)}
.cell .val{font-family:var(--font-num);font-size:20px}
.cell .tr{font-size:13px}
.up{color:var(--c-b)} .down{color:var(--ok)} .flat{color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 3px}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.q p{margin:0 0 8px}
.opts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.opts li{border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.opts li.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.opts li.right::after{content:"  ✓ 正确";color:var(--ok);font-weight:700}
.opts li.wrong{opacity:.55}
.ans{display:none;margin-top:10px;border-left:4px solid var(--ok);padding:4px 12px;background:var(--stage);border-radius:0 8px 8px 0}
.ans.on{display:block}
.method{color:var(--muted);font-size:15px;margin:0 0 6px}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:6px}
.panel[hidden]{display:none}
.theme{position:absolute;right:16px;top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>动态平衡问题动画演示</h1>
  <p class="sub">专题强化6 · 强化点二　动态平衡问题 · 例2 解析法 / 例3 图解法 / 例4 相似三角形法。每题先点“播放”看现象，再拖动进度条逐帧观察。</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panels"></div>
</div>

<script>
"use strict";
/* ---------- 通用小工具 ---------- */
const DEG = Math.PI/180;
const lerp=(a,b,t)=>a+(b-a)*t;
const f2=x=>x.toFixed(2);
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function lab(name,sub,col){ // 斜体字母 + 真下标
  return `<tspan font-style="italic" fill="${col||'currentColor'}">${name}</tspan>`+(sub?`<tspan dy="4" font-size="72%" font-style="italic" fill="${col||'currentColor'}">${sub}</tspan><tspan dy="-4"> </tspan>`:'');
}
// 箭头：(x1,y1)->(x2,y2)，像素坐标
function arrow(x1,y1,x2,y2,col,w=3.2,dash){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy); if(L<2) return '';
  const ux=dx/L,uy=dy/L,h=Math.min(11,L*.5),b=h*.45;
  const bx=x2-ux*h,by=y2-uy*h;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''}/>`+
    `<polygon points="${x2},${y2} ${bx-uy*b},${by+ux*b} ${bx+uy*b},${by-ux*b}" fill="${col}"/>`;
}
function text(x,y,html,size=15,anchor='start'){return `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}">${html}</text>`;}
function hatch(x,y,w,h,id){ // 墙面斜线
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--wall)"/>`+
   `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${id})"/>`;
}
const defs=(id)=>`<defs><pattern id="${id}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--wall-line)" stroke-width="2"/></pattern></defs>`;

/* 把三个首尾相接的力画成封闭三角形：vs=[{v:[x,y],col,name}]，单位 G，k=像素每 G，原点(ox,oy) */
function triangle(vs,k,ox,oy,extra=''){
  let x=ox,y=oy,s=extra;
  vs.forEach(a=>{
    const nx=x+a.v[0]*k,ny=y-a.v[1]*k;
    s+=arrow(x,y,nx,ny,a.col,3);
    const mx=(x+nx)/2,my=(y+ny)/2,dx=nx-x,dy=ny-y,L=Math.hypot(dx,dy)||1;
    s+=text(mx+(-dy/L)*(a.off??14)-6,my+(dx/L)*(a.off??14)+5,a.name,15);
    x=nx;y=ny;
  });
  return s;
}

/* ---------- 三道题的物理模型 ---------- */
/* 例2：悬绳长度 L 变大。 sinθ = d/L；F1 cosθ = G；F2 = G tanθ */
const E2={d:1,L0:1/Math.sin(45*DEG),L1:1/Math.sin(15*DEG)};
E2.at=s=>{const L=lerp(E2.L0,E2.L1,s),th=Math.asin(E2.d/L);return{L,th,F1:1/Math.cos(th),F2:Math.tan(th)};};
/* 例3：O 点不动，OA 固定与竖直方向夹 α，OB 从水平转到与水平成 φ。 */
const E3={al:40*DEG,p0:0,p1:65*DEG};
E3.at=s=>{const p=lerp(E3.p0,E3.p1,s),a=E3.al;const TA=Math.cos(p)/Math.cos(p-a),TB=Math.sin(a)/Math.cos(p-a);
  return{p,th:Math.PI/2+a-p,TA,TB};};
/* 例4：杆 OA 长 R=1 绕 O 从与竖直夹 β 转到竖直，B 点固定，OB=D。 */
const E4={R:1,D:.9,b0:35*DEG};
E4.at=s=>{const b=lerp(E4.b0,0,s),R=E4.R,D=E4.D;
  const A=[-R*Math.sin(b),R*Math.cos(b)],B=[D,0];
  const ab=[B[0]-A[0],B[1]-A[1]],L=Math.hypot(ab[0],ab[1]),u=[ab[0]/L,ab[1]/L];
  const n=[-Math.sin(b),Math.cos(b)];
  // N n + T u = (0,1)（G=1）
  const det=n[0]*u[1]-n[1]*u[0];
  const N=(0*u[1]-1*u[0])/det, T=(n[0]*1-n[1]*0)/det;
  const OC=A[1]*D/(D+R*Math.sin(b)); // 竖直线 x=0 与 AB 的交点高度
  const AC=Math.hypot(A[0],A[1]-OC);
  return{b,A,B,u,n,N,T,OC,AC,AO:R,L};};

/* ---------- 每题的绘制 ---------- */
const scenes=[];

scenes.push({
  id:'e2', tab:'例2', tabSub:'解析法', kind:'玻璃外墙清洁工',
  curves:[{k:'F1',c:'--c-a',f:s=>E2.at(s).F1},{k:'F2',c:'--c-b',f:s=>E2.at(s).F2}],
  method:'解析法：先把 <i>F</i><sub>1</sub>、<i>F</i><sub>2</sub> 合成，合力 <i>F</i><sub>合</sub> 与 <i>G</i> 等大反向（图中虚线平行四边形）；再任取一个位置受力分析，列平衡方程，写出 <i>F</i><sub>1</sub>、<i>F</i><sub>2</sub> 关于 <i>θ</i> 的函数，再看 <i>θ</i> 怎么变。',
  stem:'【例2】工人用一根绳索吊着自己，脚蹬竖直墙壁悬停作业。悬绳拉力 <i>F</i><sub>1</sub>，墙壁支持力 <i>F</i><sub>2</sub>，忽略脚与墙间摩擦。缓慢增加悬绳的长度的过程中（　　）',
  opts:['<i>F</i><sub>1</sub> 增大，<i>F</i><sub>2</sub> 增大','<i>F</i><sub>1</sub> 增大，<i>F</i><sub>2</sub> 减小','<i>F</i><sub>1</sub> 减小，<i>F</i><sub>2</sub> 增大','<i>F</i><sub>1</sub> 减小，<i>F</i><sub>2</sub> 减小'], right:3,
  answer:'设悬绳与墙面夹角为 <i>θ</i>。竖直方向 <i>F</i><sub>1</sub>cos <i>θ</i> = <i>G</i>，得 <i>F</i><sub>1</sub> = <span class="frac"><span><i>G</i></span><span>cos <i>θ</i></span></span>；水平方向 <i>F</i><sub>2</sub> = <i>F</i><sub>1</sub>sin <i>θ</i> = <i>G</i> tan <i>θ</i>。绳变长，<i>θ</i> 变小，cos <i>θ</i> 变大、tan <i>θ</i> 变小，所以 <i>F</i><sub>1</sub>、<i>F</i><sub>2</sub> 都减小，选 D。',
  formula:'<i>F</i><sub>1</sub> = <span class="frac"><span><i>G</i></span><span>cos <i>θ</i></span></span>，　<i>F</i><sub>2</sub> = <i>G</i> tan <i>θ</i>',
  legend:[['--c-g','重力 <i>G</i>'],['--c-a','悬绳拉力 <i>F</i><sub>1</sub>'],['--c-b','墙壁支持力 <i>F</i><sub>2</sub>'],['--c-n','<i>F</i><sub>1</sub>、<i>F</i><sub>2</sub> 的合力 <i>F</i><sub>合</sub>（与 <i>G</i> 等大反向）']],
  stage(s){
    const m=E2.at(s),u=88,wx=360,py=34;
    const ox=wx-E2.d*u,oy=py+m.L*Math.cos(m.th)*u;
    const G=84; // 像素
    let o=defs('h2')+hatch(wx,0,130,520,'h2');
    // 玻璃幕墙窗格
    for(let y=30;y<520;y+=70) o+=`<line x1="${wx}" y1="${y}" x2="${wx+130}" y2="${y}" stroke="var(--wall-line)" stroke-width="1"/>`;
    o+=`<rect x="${wx-3}" y="0" width="6" height="520" fill="var(--ground)"/>`;
    // 绳子
    o+=`<line x1="${wx}" y1="${py}" x2="${ox}" y2="${oy}" stroke="var(--ink)" stroke-width="2.4"/><circle cx="${wx}" cy="${py}" r="5" fill="var(--ink)"/>`;
    // 工人：腿水平蹬墙，躯干上举，头
    o+=`<line x1="${ox}" y1="${oy}" x2="${wx-4}" y2="${oy}" stroke="var(--muted)" stroke-width="9" stroke-linecap="round"/>`+
       `<line x1="${ox}" y1="${oy}" x2="${ox-8}" y2="${oy-34}" stroke="var(--muted)" stroke-width="12" stroke-linecap="round"/>`+
       `<circle cx="${ox-10}" cy="${oy-50}" r="9" fill="var(--muted)"/><rect x="${wx-9}" y="${oy-8}" width="9" height="16" rx="3" fill="var(--ink)"/>`;
    o+=`<circle cx="${ox}" cy="${oy}" r="5" fill="var(--ink)"/>`;
    // 力
    const th=m.th;
    o+=arrow(ox,oy,ox,oy+G,css('--c-g'));
    o+=arrow(ox,oy,ox+Math.sin(th)*G*m.F1,oy-Math.cos(th)*G*m.F1,css('--c-a'));
    o+=arrow(ox,oy,ox-G*m.F2,oy,css('--c-b'));
    o+=text(ox+8,oy+G+4,lab('G','',css('--c-g')),17);
    o+=text(ox+Math.sin(th)*G*m.F1+8,oy-Math.cos(th)*G*m.F1+4,lab('F','1',css('--c-a')),17);
    o+=text(ox-G*m.F2-6,oy+22,lab('F','2',css('--c-b')),17,'end');
    // 先把 F1、F2 合成：合力与 G 等大反向
    {const v1=[ox+Math.sin(th)*G*m.F1,oy-Math.cos(th)*G*m.F1],v2=[ox-G*m.F2,oy],R=[ox,oy-G];
     o+=`<line x1="${v1[0]}" y1="${v1[1]}" x2="${R[0]}" y2="${R[1]}" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4"/>`+
        `<line x1="${v2[0]}" y1="${v2[1]}" x2="${R[0]}" y2="${R[1]}" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4"/>`+
        arrow(ox,oy,R[0],R[1],css('--c-n'),4);
     o+=text(ox-12,oy-G-8,lab('F','合',css('--c-n'))+'<tspan font-size="13" fill="'+css('--muted')+'"> ＝ −</tspan>'+lab('G','',css('--c-g')),16,'end');}
    // 夹角 θ
    const ar=36,a1=[ox,oy-ar],a2=[ox+Math.sin(th)*ar,oy-Math.cos(th)*ar];
    o+=`<path d="M${a1} A${ar} ${ar} 0 0 1 ${a2}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
    o+=text(ox+6,oy-ar-4,lab('θ',''),15);
    o+=`<line x1="${ox}" y1="${oy}" x2="${ox}" y2="${py+4}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>`;
    o+=`<text class="cn" x="${wx+65}" y="22" text-anchor="middle">玻璃外墙</text><text class="cn" x="${ox-10}" y="${oy+62+G*0}" text-anchor="end"></text>`;
    return `<svg viewBox="0 0 490 520" role="img" aria-label="工人悬挂在玻璃外墙，绳变长时受力变化">${o}</svg>`;
  },
  tri(s){
    const m=E2.at(s),t=Math.tan(m.th),k=100,ox=200,oy=36;
    const vs=[{v:[0,-1],col:css('--c-g'),name:lab('G','',css('--c-g')),off:-16},
              {v:[-t,0],col:css('--c-b'),name:lab('F','2',css('--c-b')),off:-14},
              {v:[t,1],col:css('--c-a'),name:lab('F','1',css('--c-a')),off:14}];
    return `<svg viewBox="0 0 300 180">${triangle(vs,k,ox,oy)}</svg>`;
  },
  readouts(s){const m=E2.at(s);return[
    {nm:'<i>θ</i>（绳与墙面夹角）',val:(m.th/DEG).toFixed(1)+'°',key:m.th},
    {nm:'<i>F</i><sub>1</sub>（单位 <i>G</i>）',val:f2(m.F1),key:m.F1},
    {nm:'<i>F</i><sub>2</sub>（单位 <i>G</i>）',val:f2(m.F2),key:m.F2}];}
});

scenes.push({
  id:'e3', tab:'例3', tabSub:'图解法', kind:'花盆悬挂',
  curves:[{k:'FOA',c:'--c-a',f:s=>E3.at(s).TA},{k:'FOB',c:'--c-b',f:s=>E3.at(s).TB}],
  method:'图解法：先把两绳拉力合成，合力 <i>F</i><sub>合</sub> 始终与 <i>G</i> 等大反向，所以大小方向都不变（图中虚线平行四边形）；重力不变（恒力），<i>OA</i> 绳拉力方向不变，<i>OB</i> 绳拉力大小、方向都变。三力首尾相接构成封闭三角形，看 <i>F</i><sub><i>OB</i></sub> 这条边怎么变。',
  stem:'【例3】用 <i>OA</i>、<i>OB</i> 两根轻绳将花盆悬于两竖直墙之间，开始时 <i>OA</i> 绳与竖直墙面呈锐角，<i>OB</i> 绳水平。保持 <i>O</i> 点位置不变，仅改变 <i>OB</i> 绳长使绳右端由 <i>B</i> 点缓慢上移至 <i>B′</i> 点，此时 <i>OB′</i> 与 <i>OA</i> 之间的夹角 <i>θ</i> &lt; 90°，在此过程中（　　）',
  opts:['<i>OA</i> 绳的拉力先增大后减小','<i>OA</i> 绳的拉力逐渐增大','<i>OB</i> 绳的拉力先减小后增大','<i>OB</i> 绳的拉力逐渐增大'], right:2,
  answer:'以结点 <i>O</i> 为研究对象，<i>G</i> 的大小方向都不变，<i>F</i><sub><i>OA</i></sub> 方向不变。<i>F</i><sub><i>OB</i></sub> 的方向从水平逐渐上转，当 <i>F</i><sub><i>OB</i></sub> 与 <i>F</i><sub><i>OA</i></sub> 垂直时最小（动画里三角形的这条边最短）。由图看出 <i>F</i><sub><i>OA</i></sub> 逐渐减小，<i>F</i><sub><i>OB</i></sub> 先减小后增大，选 C。',
  formula:'<i>F</i><sub><i>OA</i></sub> = <span class="frac"><span><i>G</i> cos <i>φ</i></span><span>cos(<i>φ</i> − <i>α</i>)</span></span>，　<i>F</i><sub><i>OB</i></sub> = <span class="frac"><span><i>G</i> sin <i>α</i></span><span>cos(<i>φ</i> − <i>α</i>)</span></span>　（<i>α</i>：<i>OA</i> 与竖直方向夹角，<i>φ</i>：<i>OB</i> 与水平方向夹角）',
  legend:[['--c-g','重力 <i>G</i>'],['--c-a','<i>F</i><sub><i>OA</i></sub>'],['--c-b','<i>F</i><sub><i>OB</i></sub>'],['--c-n','两绳拉力的合力 <i>F</i><sub>合</sub>（与 <i>G</i> 等大反向）']],
  stage(s){
    const m=E3.at(s),u=150,ox=240,oy=430,G=100,a=E3.al;
    const lw=ox-u,rw=ox+u;

function chartSVG(sc,s){
  const W=300,H=130,pl=34,pr=10,pt=10,pb=24,N=80;
  const cs=sc.curves.map(c=>({c,ys:Array.from({length:N+1},(_,i)=>c.f(i/N))}));
  const ymax=Math.max(...cs.flatMap(o=>o.ys))*1.12,ymin=0;
  const X=t=>pl+(W-pl-pr)*t,Y=v=>pt+(H-pt-pb)*(1-(v-ymin)/(ymax-ymin));
  let o='';
  for(let g=0;g<=ymax;g+=0.5) o+=`<line x1="${pl}" y1="${Y(g)}" x2="${W-pr}" y2="${Y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-5}" y="${Y(g)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${g.toFixed(1)}</text>`;
  o+=`<text class="cn" x="${(pl+W-pr)/2}" y="${H-5}" text-anchor="middle">过程进度 →</text>`;
  cs.forEach(({c,ys})=>{
    const col=css(c.c);
    o+=`<polyline fill="none" stroke="${col}" stroke-width="2.2" points="${ys.map((v,i)=>X(i/N)+','+Y(v)).join(' ')}"/>`;
    const v=c.f(s);o+=`<circle cx="${X(s)}" cy="${Y(v)}" r="4.5" fill="${col}"/>`;
  });
  o+=`<line x1="${X(s)}" y1="${pt}" x2="${X(s)}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  return `<svg viewBox="0 0 ${W} ${H}">${o}</svg>`;
}
function curveLegend(sc){
  const names={e2:[['--c-a','<i>F</i><sub>1</sub>'],['--c-b','<i>F</i><sub>2</sub>']],
               e3:[['--c-a','<i>F</i><sub><i>OA</i></sub>'],['--c-b','<i>F</i><sub><i>OB</i></sub>']],
               e4:[['--c-n','<i>F</i><sub><i>OA</i></sub>'],['--c-b','<i>F</i><sub><i>AB</i></sub>']]}[sc.id];
  return names.map(([c,t])=>`<span><span class="dot" style="background:var(${c})"></span>${t}</span>`).join('');
}

  <div class="card q" style="margin-top:14px">
    <p class="method">${sc.method}</p>
    <p>${sc.stem}</p>
    <ul class="opts" id="op${i}">${sc.opts.map((t,j)=>`<li>${'ABCD'[j]}．${t}</li>`).join('')}</ul>
    <p class="note" style="margin-top:10px">解析式：${sc.formula}</p>
    <div class="ctrl"><button class="btn" id="ans${i}">显示答案和解析</button></div>
    <div class="ans" id="an${i}"><p style="margin:0"><b>解析：</b>${sc.answer}</p></div>
  </div>`;
  panels.appendChild(p);
  const $=id=>document.getElementById(id+i);
  if(sc.mover){
    $('mvb').onclick=()=>{ if(state.mv[i]>=1) state.mv[i]=0; state.mvPlaying=!state.mvPlaying; if(state.mvPlaying) state.playing=false; sync(); };
    $('mvs').oninput=e=>{state.mvPlaying=false;state.playing=false;state.mv[i]=e.target.value/1000;sync();};
    $('mvr').onclick=()=>{state.mvPlaying=false;state.mv[i]=0;sync();};
  }
  $('play').onclick=()=>{ if(state.s[i]>=1) state.s[i]=0; state.playing=!state.playing; if(state.playing){state.mvPlaying=false;state.mv[i]=0;} sync(); };
  $('replay').onclick=()=>{state.s[i]=0;state.playing=true;state.mvPlaying=false;state.mv[i]=0;sync();};
  $('sl').oninput=e=>{state.playing=false;state.mvPlaying=false;state.mv[i]=0;state.s[i]=e.target.value/1000;sync();};
  $('sp').onclick=()=>{state.speed=state.speed===1?.4:1;sync();};
  $('ans').onclick=()=>{ state.shown[i]=!state.shown[i]; sync(); };
});

function select(i){
  state.cur=i;state.playing=false;
  scenes.forEach((_,j)=>{document.getElementById('p'+j).hidden=j!==i;document.getElementById('tab'+j).setAttribute('aria-selected',j===i);});
  sync();
}
let prevVals={};
function sync(){
  const i=state.cur,sc=scenes[i],s=Math.min(1,Math.max(0,state.s[i]));
  const $=id=>document.getElementById(id+i);
  $('stage').innerHTML=sc.stage(s,{mv:state.mv[i]});
  $('tri').innerHTML=sc.tri(s);
  $('ch').innerHTML=chartSVG(sc,s);
  // 读数与趋势（和进度稍早一点的值比较）
  const now=sc.readouts(s),before=sc.readouts(Math.max(0,s-.03));
  $('rd').innerHTML=now.map((r,j)=>{
    const d=r.key-before[j].key;let tr='<span class="flat">—</span>';
    if(s>0.005&&Math.abs(d)>1e-4) tr=d>0?'<span class="up">▲ 增大</span>':'<span class="down">▼ 减小</span>';
    return `<div class="cell"><div class="nm">${r.nm}</div><div class="val">${r.val}</div><div class="tr">${tr}</div></div>`;
  }).join('');
  $('sl').value=Math.round(s*1000);
  if(sc.mover){ $('mvs').value=Math.round(state.mv[i]*1000);
    $('mvb').textContent=state.mvPlaying?'⏸ 暂停平移':(state.mv[i]>=1?'↺ 再演示一次':'▶ 演示力的平移'); }
  $('play').textContent=state.playing?'⏸ 暂停':(s>=1?'↺ 再播一次':'▶ 播放');
  $('sp').setAttribute('aria-pressed',state.speed!==1);
  const show=state.shown[i];
  $('an').classList.toggle('on',show);
  $('ans').textContent=show?'隐藏答案和解析':'显示答案和解析';
  [...$('op').children].forEach((li,j)=>{li.className=show?(j===sc.right?'right':'wrong'):'';});
}
let last=0;
function tick(t){
  if(state.mvPlaying){
    const dt=Math.min(60,t-last),i=state.cur;
    state.mv[i]=Math.min(1,state.mv[i]+dt*state.speed/5000);
    if(state.mv[i]>=1) state.mvPlaying=false;
    sync();
  }
  if(state.playing){
    const dt=Math.min(60,t-last),i=state.cur;
    state.s[i]=Math.min(1,state.s[i]+dt*state.speed/state.dur);
    if(state.s[i]>=1) state.playing=false;
    sync();
  }
  last=t;requestAnimationFrame(tick);
}
requestAnimationFrame(t=>{last=t;tick(t);});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',sync);
sync();
</script>
</body>
</html>
