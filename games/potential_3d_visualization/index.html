<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>电势：二维电场与三维电势面</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>电势：二维电场（左）与三维电势面（右）</h1>
    <div class="header-right">
      <div class="legend">
        <span><span class="dot" style="background:#d44056"></span>正电荷</span>
        <span><span class="dot" style="background:#3873d4"></span>负电荷</span>
        <span><span class="dot" style="background:#e8a830"></span>试探粒子</span>
      </div>
    </div>
  </header>
  <div id="main">
    <div class="panel">
      <div class="label">左 · 二维电场（电场线和等势线）</div>
      <div class="hint">单击放置所选对象 · 拖动设置试探粒子初速度 · 右键删除</div>
      <canvas id="canvas2d"></canvas>
    </div>
    <div class="panel">
      <div class="label">右 · 三维电势面（高度 = 电势 φ）</div>
      <div class="hint">左键拖动旋转 · 滚轮缩放 · 粒子在重力作用下沿曲面滑动</div>
      <div id="canvas3d"></div>
    </div>
  </div>
  <footer>

    <div class="section sec-field">
      <span class="section-title">第 1 步 · 布置电场</span>
      <button id="mode-pos" class="active">+ 正电荷</button>
      <button id="mode-neg">− 负电荷</button>
      <span class="label-s">|q|</span>
      <input type="range" id="q-mag" min="0.2" max="3" step="0.1" value="1.0">
      <span class="slider-val" id="q-mag-val">1.0</span>
      <button id="btn-clear-field" class="danger">清除电荷</button>
    </div>

    <div class="section sec-particle">
      <span class="section-title">第 2 步 · 放置试探粒子</span>
      <button id="mode-part">放置粒子</button>
      <span class="label-s">q<sub>p</sub></span>
      <input type="range" id="qp" min="-2" max="2" step="0.1" value="1.0">
      <span class="slider-val" id="qp-val">+1.0</span>
      <span class="label-s">v<sub>0x</sub></span>
      <input type="range" id="vx0" min="-5" max="5" step="0.1" value="0">
      <span class="slider-val" id="vx0-val">0.0</span>
      <span class="label-s">v<sub>0y</sub></span>
      <input type="range" id="vy0" min="-5" max="5" step="0.1" value="0">
      <span class="slider-val" id="vy0-val">0.0</span>
      <button id="btn-clear-parts" class="danger">清除粒子</button>
    </div>

    <div class="section sec-sim">
      <span class="section-title">第 3 步 · 运行</span>
      <button id="btn-play" class="go">▶ 开始</button>
      <button id="btn-reset">↺ 粒子复位</button>
    </div>

    <div class="section sec-view">
      <span class="section-title">显示</span>
      <label class="chk"><input type="checkbox" id="show-field" checked>电场线</label>
      <label class="chk"><input type="checkbox" id="show-equi" checked>等势线</label>
      <label class="chk"><input type="checkbox" id="show-pcolor" checked>电势着色</label>
      <label class="chk"><input type="checkbox" id="show-trail" checked>轨迹</label>
    </div>

    <div class="section sec-view">
      <span class="section-title">预设</span>
      <button id="preset-dipole">等量异种电荷</button>
      <button id="preset-quad">四极子</button>
      <button id="preset-uniform">匀强电场</button>
    </div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="main.js"></script>
</body>
</html>
