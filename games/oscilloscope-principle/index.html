<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscilloscope Principle Demo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="top-bar">
        <div>
            <h1>Oscilloscope Principle Demo</h1>
        </div>
    </header>

    <main class="layout">
        <section class="panel controls-panel">
            <div class="section-title">
                <h2>Voltage Controls</h2>
                <button id="resetBtn" class="ghost-button" type="button">Reset</button>
            </div>

            <div class="preset-group" aria-label="X voltage mode">
                <span>X mode</span>
                <div class="segmented-control">
                    <button class="mode-button active" type="button" data-axis="x" data-mode="manual">Manual</button>
                    <button class="mode-button" type="button" data-axis="x" data-mode="sweep">Sweep</button>
                </div>
            </div>

            <label class="slider-row">
                <span>X voltage</span>
                <input id="voltageX" type="range" min="-120" max="120" step="1" value="0">
                <output id="voltageXLabel">0 V</output>
            </label>

            <div class="preset-group" aria-label="Y voltage mode">
                <span>Y mode</span>
                <div class="segmented-control">
                    <button class="mode-button active" type="button" data-axis="y" data-mode="manual">Manual</button>
                    <button class="mode-button" type="button" data-axis="y" data-mode="sine">Sine</button>
                </div>
            </div>

            <label class="slider-row">
                <span>Y voltage</span>
                <input id="voltageY" type="range" min="-120" max="120" step="1" value="0">
                <output id="voltageYLabel">0 V</output>
            </label>

            <label class="slider-row">
                <span>Beam intensity</span>
                <input id="intensity" type="range" min="10" max="100" step="1" value="72">
                <output id="intensityLabel">72%</output>
            </label>

            <div class="toggles">
                <label class="check-row">
                    <input id="traceToggle" type="checkbox" checked>
                    <span>Keep phosphor trace</span>
                </label>
                <label class="check-row">
                    <input id="animateToggle" type="checkbox" checked>
                    <span>Animate ion beam</span>
                </label>
            </div>

            <div class="formula-box">
                <h3>Screen Readout</h3>
                <p>X shift:<strong id="xShift">0.0</strong> div</p>
                <p>Y shift:<strong id="yShift">0.0</strong> div</p>
            </div>
        </section>

        <section class="panel screen-panel">
            <div class="section-title">
                <h2>Fluorescent Screen</h2>
                <div class="legend">
                    <span><i class="spot-swatch"></i>Ion spot</span>
                    <span><i class="trace-swatch"></i>Trace</span>
                </div>
            </div>
            <div class="scope-shell">
                <canvas id="screenCanvas" width="720" height="520" aria-label="Oscilloscope fluorescent screen"></canvas>
            </div>
        </section>

        <section class="panel beam-panel">
            <div class="section-title">
                <h2>Beam Deflection</h2>
                <div class="beam-readout">
                    <span id="fieldXLabel">Ex = 0.00</span>
                    <span id="fieldYLabel">Ey = 0.00</span>
                </div>
            </div>
            <canvas id="beamCanvas" width="1100" height="360" aria-label="Ion beam through deflection plates"></canvas>
        </section>
    </main>

    <footer>
        <p>This simplified model ignores gravity and collisions, focusing only on voltage-driven beam deflection.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
