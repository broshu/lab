<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alternating Field Release</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="top-bar">
        <div>
            <h1>Alternating Field Release</h1>
        </div>
        <div class="readout">
            <span>Release time</span>
            <strong id="phaseReadout">5T/8</strong>
        </div>
    </header>

    <main class="layout">
        <section class="panel controls-panel">
            <div class="section-title">
                <h2>Controls</h2>
                <button id="resetBtn" class="ghost-button" type="button">Reset</button>
            </div>

            <label class="slider-row">
                <span>0</span>
                <input id="phaseInput" type="range" min="0" max="1" step="0.005" value="0.625">
                <output id="phaseLabel">5T/8</output>
            </label>

            <div class="button-row">
                <button id="releaseBtn" class="primary-button" type="button">Release</button>
                <button id="pauseBtn" class="ghost-button" type="button">Pause</button>
            </div>

            <div class="formula-box">
                <h3>Readout</h3>
                <p>Net drift:<strong id="driftReadout">to plate A</strong></p>
                <p>Result:<strong id="resultReadout">ready</strong></p>
                <p>Speed:<strong id="speedReadout">0.00</strong></p>
            </div>
        </section>

        <section class="panel field-panel">
            <div class="section-title">
                <h2>Motion</h2>
                <div class="legend">
                    <span><i class="field-swatch"></i>Field</span>
                    <span><i class="flame-swatch"></i>Trail</span>
                    <span><i class="path-swatch"></i>Path</span>
                </div>
            </div>
            <canvas id="motionCanvas" width="980" height="500" aria-label="Positive particle motion in an alternating electric field"></canvas>
        </section>

        <section class="panel graph-panel">
            <div class="section-title">
                <h2>Graphs</h2>
            </div>
            <canvas id="graphCanvas" width="1300" height="420" aria-label="Voltage-time and velocity-time graphs"></canvas>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
