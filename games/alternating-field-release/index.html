<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交变电场中粒子的释放</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="top-bar">
        <div>
            <h1>交变电场中粒子的释放</h1>
        </div>
        <div class="readout">
            <span>释放时刻</span>
            <strong id="phaseReadout">5T/8</strong>
        </div>
    </header>

    <main class="layout">
        <section class="panel controls-panel">
            <div class="section-title">
                <h2>控制</h2>
                <button id="resetBtn" class="ghost-button" type="button">重置</button>
            </div>

            <label class="slider-row">
                <span>0</span>
                <input id="phaseInput" type="range" min="0" max="1" step="0.005" value="0.625">
                <output id="phaseLabel">5T/8</output>
            </label>

            <div class="button-row">
                <button id="releaseBtn" class="primary-button" type="button">释放</button>
                <button id="pauseBtn" class="ghost-button" type="button">暂停</button>
            </div>

            <div class="formula-box">
                <h3>读数</h3>
                <p>净漂移：<strong id="driftReadout">向 A 板</strong></p>
                <p>结果：<strong id="resultReadout">就绪</strong></p>
                <p>速度：<strong id="speedReadout">0.00</strong></p>
            </div>
        </section>

        <section class="panel field-panel">
            <div class="section-title">
                <h2>运动过程</h2>
                <div class="legend">
                    <span><i class="field-swatch"></i>电场</span>
                    <span><i class="flame-swatch"></i>拖尾</span>
                    <span><i class="path-swatch"></i>轨迹</span>
                </div>
            </div>
            <canvas id="motionCanvas" width="980" height="500" aria-label="交变电场中正粒子的运动"></canvas>
        </section>

        <section class="panel graph-panel">
            <div class="section-title">
                <h2>图像</h2>
            </div>
            <canvas id="graphCanvas" width="1300" height="420" aria-label="电压-时间与速度-时间图像"></canvas>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
