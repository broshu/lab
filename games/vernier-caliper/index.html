<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游标卡尺读数</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="top-bar">
        <div>
            <h1>游标卡尺读数</h1>
        </div>
        <div class="preset-group" aria-label="游标类型">
            <div class="segmented-control" id="modeControl">
                <button class="mode-button active" type="button" data-mode="10">
                    10 分度<small>0.1 mm</small>
                </button>
                <button class="mode-button" type="button" data-mode="20">
                    20 分度<small>0.05 mm</small>
                </button>
                <button class="mode-button" type="button" data-mode="50">
                    50 分度<small>0.02 mm</small>
                </button>
            </div>
        </div>
    </header>

    <main class="layout">
        <section class="panel stage-panel">
            <div class="stage">
                <canvas id="caliper" width="1140" height="500"
                        tabindex="0" aria-label="可拖动的游标卡尺"></canvas>
            </div>
        </section>

        <section class="panel readout-panel">
            <div class="readout">
                <div class="read-card">
                    <span class="read-label">主尺</span>
                    <strong id="rMain">0 mm</strong>
                </div>
                <div class="read-op">+</div>
                <div class="read-card">
                    <span class="read-label">游标尺</span>
                    <strong id="rVern">0 &times; 0.10 = 0.00 mm</strong>
                </div>
                <div class="read-op">=</div>
                <div class="read-card total">
                    <span class="read-label">读数</span>
                    <strong id="rTotal">0.00 mm</strong>
                </div>
            </div>
            <div class="actions">
                <button id="revealBtn" class="reveal-button" type="button">隐藏答案</button>
                <button id="resetBtn" class="ghost-button" type="button">重置</button>
            </div>
        </section>
    </main>

    <footer>
        <p>拖动游标或被测物块，也可以用键盘 &larr; &rarr; 方向键微调，然后读数。</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
