<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物理实验室</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="site.css">
  <style>
    main {
      padding: 28px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--ink);
      border-radius: 6px;
      color: var(--ink);
      background: #fff;
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }

    .back-link:hover,
    .back-link:focus-visible {
      color: #fff;
      background: var(--ink);
      outline: none;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 700;
    }

    .path {
      margin: -8px 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
    }

    .panel .item-list {
      padding: 0 22px;
    }

    .panel .item-link {
      padding: 10px 0;
      font-size: 16px;
    }

    @media (max-width: 560px) {
      main {
        width: calc(100% - 24px);
        padding: 22px 0 32px;
      }

      h1 {
        font-size: 26px;
      }

      .panel .item-list {
        padding: 0 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <a class="back-link" id="back-link" href="index.html">返回</a>
      <span class="meta" id="item-count"></span>
    </div>
    <h1 id="page-title"></h1>
    <div class="path" id="page-path"></div>
    <section class="panel">
      <ul class="item-list" id="item-list"></ul>
    </section>
  </main>

  <script src="site.js"></script>
  <script>
    const { el, countText, sectionUrl, itemRow } = window.Lab;

    // 按路径逐层找到文件夹；路径里有不存在的层级时停在最后一个找得到的文件夹。
    function findFolder(section, pathParts) {
      let folder = { name: section.title, children: section.items };
      const found = [];
      for (const part of pathParts) {
        const next = folder.children.find((item) => item.type === "folder" && item.name === part);
        if (!next) {
          break;
        }
        folder = next;
        found.push(part);
      }
      return { folder, found };
    }

    window.Lab.loadSections().then((sections) => {
      const listRoot = document.querySelector("#item-list");
      const params = new URLSearchParams(window.location.search);
      const section = sections.find((item) => item.id === params.get("section")) || sections[0];

      if (!section) {
        document.querySelector("#page-title").textContent = "加载失败";
        listRoot.append(el("li", "empty-note", "目录没有加载出来，请刷新页面重试。"));
        return;
      }

      const requested = (params.get("path") || "").split("/").filter(Boolean);
      const { folder, found: path } = findFolder(section, requested);
      const title = path.length > 0 ? folder.name : section.title;

      document.title = `${title} - 物理实验室`;
      document.querySelector("#page-title").textContent = title;
      document.querySelector("#page-path").textContent = path.length > 0 ? [section.title, ...path].join(" / ") : "";
      document.querySelector("#item-count").textContent = countText(folder.children.length);
      document.querySelector("#back-link").href = path.length > 0 ? sectionUrl(section.id, path.slice(0, -1)) : "index.html";

      listRoot.replaceChildren(...folder.children.map((item) => itemRow(item, section, path)));
      if (folder.children.length === 0) {
        listRoot.append(el("li", "empty-note", "暂无内容"));
      }
    });
  </script>
</body>
</html>
