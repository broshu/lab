name: Build and deploy site

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "library.html"
      - "library-data.js"
      - "icon.png"
      - "CNAME"
      - "ppt/**"
      - "games/**"
      - "resources/**"
      - "tutor/**"
      - "scripts/build-manifest.mjs"
      - ".github/workflows/update-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build manifest
        run: node scripts/build-manifest.mjs

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html library.html library-data.js icon.png CNAME manifest.json _site/
          cp -R ppt games resources _site/
          mkdir -p _site/tutor
          cp tutor/index.html tutor/data.js _site/tutor/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
