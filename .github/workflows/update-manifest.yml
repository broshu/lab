name: Build and deploy site

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "library.html"
      - "site.css"
      - "site.js"
      - "icon.png"
      - "CNAME"
      - "ppt/**"
      - "games/**"
      - "tutor/**"
      - "scripts/build-manifest.mjs"
      - ".github/workflows/update-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run game tests
        run: |
          for t in games/*/tests/*.test.js; do
            echo "== $t"
            node "$t"
          done

      - name: Build homework answers
        run: python3 tutor/build.py

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html library.html site.css site.js icon.png CNAME _site/
          cp -R ppt games _site/
          mkdir -p _site/tutor
          cp tutor/index.html tutor/screen.html tutor/data.js _site/tutor/
          cp -R tutor/assets _site/tutor/

      # 课件文件名可以照常用中文；这一步按 ppt/links.json 把网站上的链接改成英文，页面上仍显示中文名。
      - name: Build manifest
        run: node scripts/build-manifest.mjs _site

      - name: Check links have no Chinese
        run: |
          bad=$(cd _site && LC_ALL=C find . -name '*[! -~]*' -o -name '* *')
          if [ -n "$bad" ]; then
            echo "::warning::以下网站文件的链接仍含中文或空格：$bad"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
